                    tt.serveTimer--;
                    if (tt.serveTimer <= 0 && !tt.serveTossed) {
                        tossTTBall();
                    }
                    return;
                }

                if (tt.phase === "point") {
                    tt.pointTimer--;
                    if (tt.pointTimer <= 0) {
                        if (tt.gameOver) {
                            tt.phase = "gameover";
                        } else {
                            // Saque alterna a cada 2 pontos
                            tt.server = Math.floor(tt.totalPoints / 2) % 2 === 0
                                ? "p1"
                                : "p2";
                            startTTServe();
                        }
                    }
                    return;
                }

                if (tt.phase !== "rally") return;

                updateTTBall();
            }

            // ══════════════════════════════════════
            //  TÊNIS — Física e regras da bola (host)
            // ══════════════════════════════════════

            function updateTTBall() {
                if (!tt.rallyActive) return;

                const prevX = tt.ballX;

                // Gravidade e movimento
                tt.ballVY += TT.GRAVITY;
                tt.ballX += tt.ballVX;
                tt.ballY += tt.ballVY;

                // Colisão com a rede (só na primeira travessia após um golpe)
                if (!tt.crossedNet && tt.lastHitter) {
                    const crossed =
                        (prevX < TT.NET_X && tt.ballX >= TT.NET_X) ||
                        (prevX > TT.NET_X && tt.ballX <= TT.NET_X);

                    if (crossed) {
                        if (tt.ballY + TT.BALL_R > TT.NET_TOP) {
                            // Bateu na rede
                            tt.netFlash = 1;
                            tt.ballX = TT.NET_X;
                            tt.ballVX *= -0.2;
                            tt.ballVY = Math.abs(tt.ballVY) * 0.3;
                            sfxTTNet();
                            awardTT(
                                tt.lastHitter === "p1" ? "p2" : "p1",
                                "NA REDE"
                            );
                            return;
                        }
                        tt.crossedNet = true;
                    }
                }

                // Quique na mesa
                if (tt.ballY + TT.BALL_R >= TT.TABLE_Y && tt.ballVY > 0) {
                    tt.ballY = TT.TABLE_Y - TT.BALL_R;
                    tt.ballVY = -tt.ballVY * TT.BOUNCE;
                    tt.ballVX *= 0.985;
                    sfxTTBounce();

                    const side = tt.ballX < TT.NET_X ? "p1" : "p2";
                    tt.bouncesOnSide[side]++;

                    if (tt.bouncesOnSide[side] >= 2) {
                        awardTT(
                            side === "p1" ? "p2" : "p1",
                            "QUIQUE DUPLO"
                        );
                        return;
                    }

                    // Se a bola quicou no lado de quem bateu, é falta
                    if (tt.lastHitter && side === tt.lastHitter) {
                        awardTT(
                            tt.lastHitter === "p1" ? "p2" : "p1",
                            "FORA"
                        );
                        return;
                    }
                }

                // Fora da quadra
                if (tt.ballX < TT.LEFT || tt.ballX > TT.RIGHT) {
                    const outSide = tt.ballX < TT.NET_X ? "p1" : "p2";

                    if (tt.lastHitter) {
                        if (outSide === tt.lastHitter) {
                            awardTT(
                                tt.lastHitter === "p1" ? "p2" : "p1",
                                "FORA"
                            );
                        } else if (tt.crossedNet && tt.bouncesOnSide[outSide] >= 1) {
                            awardTT(tt.lastHitter, "PONTO");
                        } else {
                            awardTT(
                                tt.lastHitter === "p1" ? "p2" : "p1",
                                "FORA"
                            );
                        }
                    } else {
                        awardTT(outSide === "p1" ? "p2" : "p1", "FORA");
                    }
                    return;
                }

                // Rastro da bola
                tt.ballTrail.push({ x: tt.ballX, y: tt.ballY });
                if (tt.ballTrail.length > 10) tt.ballTrail.shift();
            }

            // ══════════════════════════════════════
            //  TÊNIS — Pontuação
            // ══════════════════════════════════════

            function awardTT(winner, reason) {
                if (tt.gameOver) return;
                if (tt.phase === "point" || tt.phase === "gameover") return;

                if (winner === "p1") tt.score1++;
                else tt.score2++;

                tt.totalPoints++;
                tt.lastPoint = winner;
                tt.phase = "point";
                tt.pointTimer = TT.POINT_DELAY;
                tt.pointMessage = reason || "PONTO";
                tt.pointMessageColor = winner === "p1" ? "#39ff88" : "#ff4d5a";
                tt.rallyActive = false;
                tt.charging = false;
                tt.chargeShot = null;
                tt.charge = 0;
                tt.hitFlash = 1;
                tt.screenFlash = 0.7;

                updateScoreDisplay();
                sfxTTScore();

                if (tt.score1 >= WINNING_SCORE || tt.score2 >= WINNING_SCORE) {
                    tt.gameOver = true;
                    tt.winner = tt.score1 >= WINNING_SCORE
                        ? (isHost ? myName : otherName)
                        : (isHost ? otherName : myName);
                    sfxWin();
                }

                broadcastTTState();
            }

            // ══════════════════════════════════════
            //  TÊNIS — Broadcast (host → guest)
            // ══════════════════════════════════════

            function broadcastTTState() {
                if (connection && connection.open && isHost) {
                    connection.send({
                        type: "ttState",
                        ballX: tt.ballX,
                        ballY: tt.ballY,
                        ballVX: tt.ballVX,
                        ballVY: tt.ballVY,
                        trail: tt.ballTrail.slice(-10),

                        score1: tt.score1,
                        score2: tt.score2,
                        totalPoints: tt.totalPoints,
                        gameOver: tt.gameOver,
                        winner: tt.winner,

                        phase: tt.phase,
                        server: tt.server,
                        serveTimer: tt.serveTimer,
                        serveTossed: tt.serveTossed,
                        pointTimer: tt.pointTimer,
                        pointMessage: tt.pointMessage,
                        pointMessageColor: tt.pointMessageColor,
                        lastPoint: tt.lastPoint,

                        rallyActive: tt.rallyActive,
                        lastHitter: tt.lastHitter,
                        lastShot: tt.lastShot,
                        lastCharge: tt.lastCharge,
                        crossedNet: tt.crossedNet,
                        bouncesOnSide: tt.bouncesOnSide,

                        p1Charging: tt.charging,
                        p1Shot: tt.chargeShot,
                        p1Charge: tt.charge,
                        p1Stamina: tt.stamina
                    });
                }
            }

            // ══════════════════════════════════════
            //  PESCA — Lógica (host)
            // ══════════════════════════════════════

            function pickFish() {
                const total = FISH_TYPES.reduce((sum, f) => sum + f.weight, 0);
                let roll = Math.random() * total;

                for (const f of FISH_TYPES) {
                    roll -= f.weight;
                    if (roll <= 0) return f;
                }
                return FISH_TYPES[0];
            }

            function resetFishMatch(keepScore) {
                if (!keepScore) {
                    fish.score1 = 0;
                    fish.score2 = 0;
                    fish.value1 = 0;
                    fish.value2 = 0;
                }

                fish.gameOver = false;
                fish.winner = "";
                fish.feedback = "";
                fish.feedbackTimer = 0;
                fish.screenFlash = 0;
                fish.localHolding = false;
                fish.p1Holding = false;
                fish.p2Holding = false;

                fish.panels = {
                    p1: createFishPanel(),
                    p2: createFishPanel()
                };

                fishSoundState.p1 = "ready";
                fishSoundState.p2 = "ready";

                updateScoreDisplay();
            }

            function updateFishMatch() {
                if (fish.feedbackTimer > 0) {
                    fish.feedbackTimer--;
                    if (fish.feedbackTimer <= 0) fish.feedback = "";
                }
                if (fish.screenFlash > 0) fish.screenFlash *= 0.9;

                if (fish.gameOver) return;

                updateFishPanel("p1", fish.p1Holding);

                if (!fish.gameOver) {
                    updateFishPanel("p2", fish.p2Holding);
                }
            }

            function updateFishPanel(key, holding) {
                const p = fish.panels[key];
                const pressed = holding && !p.prevHolding;
                const released = !holding && p.prevHolding;
                p.prevHolding = holding;

                if (p.flash > 0) p.flash *= 0.9;

                switch (p.phase) {
                    case "ready":
                        if (pressed) {
                            p.phase = "cast";
                            p.castPower = 0;
                        }
                        break;

                    case "cast":
                        p.castPower = Math.min(1, p.castPower + FISH.CAST_RATE);
                        if (released) {
                            p.castPower = Math.max(0.15, p.castPower);
                            p.phase = "wait";
                            p.biteTimer = FISH.BITE_MIN +
                                Math.random() * (FISH.BITE_MAX - FISH.BITE_MIN);
                            p.biteWindow = 0;
                            sfxFishCast();
                        }
                        break;

                    case "wait":
                        p.biteTimer--;
                        if (p.biteTimer <= 0) {
                            p.phase = "bite";
                            p.biteWindow = FISH.BITE_WINDOW;
                            p.flash = 1;
                            sfxFishBite();
                        }
                        break;

                    case "bite":
                        p.biteWindow--;
                        if (pressed) {
                            startFishReel(key);
                        } else if (p.biteWindow <= 0) {
                            finishFishAttempt(key, false, "O PEIXE FUGIU");
                        }
                        break;

                    case "reel":
                        updateFishReel(key, holding);
                        break;

                    case "result":
                        p.resultTimer--;
                        if (p.resultTimer <= 0) {
                            p.phase = "ready";
                            p.result = null;
                            p.fish = null;
                            p.progress = 0.45;
                            p.reelY = 0.5;
                            p.reelVY = 0;
                            p.fishY = 0.5;
                            p.fishVY = 0;
                        }
                        break;
                }
            }

            function startFishReel(key) {
                const p = fish.panels[key];
                const f = pickFish();

                p.fish = f;
                p.phase = "reel";
                p.progress = 0.45;
                p.reelY = 0.5;
                p.reelVY = 0;
                p.fishY = 0.5;
                p.fishVY = 0;
                p.fishTarget = 0.2 + Math.random() * 0.6;
                p.fishTimer = 30 + Math.random() * 55;
                p.barSize = clamp(
                    0.36 - (f.difficulty - 1) * 0.07,
                    0.22,
                    0.36
                );
                p.flash = 1;
                sfxFishHook();
            }

            function updateFishReel(key, holding) {
                const p = fish.panels[key];
                const f = p.fish || FISH_TYPES[0];

                // Barra verde: sobe enquanto segura, cai ao soltar
                if (holding) {
                    p.reelVY += FISH.REEL_ACCEL;
                } else {
                    p.reelVY -= FISH.REEL_GRAVITY;
                }
                p.reelVY *= FISH.REEL_DAMPING;
                p.reelY += p.reelVY;

                if (p.reelY < 0) {
                    p.reelY = 0;
                    p.reelVY = 0;
                }
                if (p.reelY > 1) {
                    p.reelY = 1;
                    p.reelVY = 0;
                }

                // Peixe se move para alvos aleatórios
                p.fishTimer--;
                if (p.fishTimer <= 0) {
                    p.fishTimer = 30 + Math.random() * 60;
                    p.fishTarget = 0.08 + Math.random() * 0.84;
                }

                const fishSpeed = 0.0016 * f.difficulty;
                p.fishVY += (p.fishTarget - p.fishY) * fishSpeed;
                p.fishVY *= 0.92;
                p.fishY += p.fishVY;

                if (p.fishY < 0.04) {
                    p.fishY = 0.04;
                    p.fishVY = Math.abs(p.fishVY) * 0.3;
                }
                if (p.fishY > 0.96) {
                    p.fishY = 0.96;
                    p.fishVY = -Math.abs(p.fishVY) * 0.3;
                }

                const inside = Math.abs(p.fishY - p.reelY) <= p.barSize / 2;
                if (inside) {
                    p.progress = Math.min(1, p.progress + FISH.PROGRESS_GAIN);
                } else {
                    p.progress = Math.max(0, p.progress - FISH.PROGRESS_LOSS);
                }

                if (p.progress >= 1) {
                    finishFishAttempt(key, true, "");
                } else if (p.progress <= 0) {
                    finishFishAttempt(key, false, "O PEIXE FUGIU");
                }
            }

            function finishFishAttempt(key, caught, message) {
                const p = fish.panels[key];
                const f = p.fish;

                p.phase = "result";
                p.resultTimer = FISH.RESULT_DELAY;
                p.flash = 1;
                p.result = {
                    caught: caught,
                    fish: caught ? f : null,
                    message: message
                };

                if (caught && f && !fish.gameOver) {
                    const size = Math.floor(
                        f.min + Math.random() * (f.max - f.min + 1)
                    );
                    const value = Math.round(
                        f.value * (0.75 + (size / f.max) * 0.5)
                    );

                    p.result.size = size;
                    p.result.value = value;

                    if (key === "p1") {
                        fish.score1++;
                        fish.value1 += value;
                    } else {
                        fish.score2++;
                        fish.value2 += value;
                    }

                    fish.feedback =
                        (key === "p1" ? "J1" : "J2") +
                        " pescou " + f.name + " (" + size + " cm)!";
                    fish.feedbackTimer = 120;
                    fish.screenFlash = 0.8;
                    sfxFishCatch();
                    updateScoreDisplay();

                    const score = key === "p1" ? fish.score1 : fish.score2;
                    if (score >= FISH.WIN_COUNT) {
                        fish.gameOver = true;
                        fish.winner = key === "p1"
                            ? (isHost ? myName : otherName)
                            : (isHost ? otherName : myName);
                        sfxWin();
                    }
                } else {
                    fish.feedback =
                        (key === "p1" ? "J1" : "J2") +
                        " perdeu o peixe...";
                    fish.feedbackTimer = 100;
                    sfxFishEscape();
                }
            }

            function broadcastFishState() {
                if (connection && connection.open && isHost) {
                    connection.send({
                        type: "fishState",
                        score1: fish.score1,
                        score2: fish.score2,
                        value1: fish.value1,
                        value2: fish.value2,
                        gameOver: fish.gameOver,
                        winner: fish.winner,
                        feedback: fish.feedback,
                        feedbackTimer: fish.feedbackTimer,
                        screenFlash: fish.screenFlash,
                        panels: {
                            p1: fish.panels.p1,
                            p2: fish.panels.p2
                        }
                    });
                }
            }

            //  Renderização (dispatch)
            // ══════════════════════════════════════

            function render() {
                if (currentMinigame === "pong") {
                    renderPong();
                } else if (currentMinigame === "tableTennis") {
                    renderTableTennis();
                } else {
                    renderFishing();
                }
            }

            // ══════════════════════════════════════
            //  Render — Pong
            // ══════════════════════════════════════

            function renderPong() {
                const now = performance.now();
                beginCRTScreen("#062c2a", "#031a1b", "#01090a");

                const fieldW = PONG.RIGHT - PONG.LEFT;
                const fieldH = PONG.BOTTOM - PONG.TOP;
                const midX = (PONG.LEFT + PONG.RIGHT) / 2;
                const midY = (PONG.TOP + PONG.BOTTOM) / 2;
                const pad = n => String(n).padStart(2, "0");

                // Campo
                ctx.strokeStyle = "rgba(120,255,220,0.12)";
                ctx.lineWidth = 1;
                ctx.strokeRect(PONG.LEFT, PONG.TOP, fieldW, fieldH);

                // Linha central tracejada
                ctx.setLineDash([9, 9]);
                ctx.strokeStyle = "rgba(234,255,251,0.20)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(midX, PONG.TOP);
                ctx.lineTo(midX, PONG.BOTTOM);
                ctx.stroke();
                ctx.setLineDash([]);

                // Placar gigante no fundo
                ctx.font = "bold 130px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "rgba(120,255,220,0.045)";
                ctx.fillText(pad(state.score1), PONG.LEFT + fieldW * 0.25, midY);
                ctx.fillText(pad(state.score2), PONG.LEFT + fieldW * 0.75, midY);

                // HUD de nomes/placar
                const p1Name = isHost ? myName : otherName;
                const p2Name = isHost ? otherName : myName;

                ctx.font = "bold 11px 'Courier New', monospace";
                ctx.textBaseline = "middle";
                ctx.textAlign = "left";
                ctx.fillStyle = "#39ff88";
                ctx.fillText(p1Name.toUpperCase().slice(0, 14), PONG.LEFT, 54);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ff4d5a";
                ctx.fillText(p2Name.toUpperCase().slice(0, 14), PONG.RIGHT, 54);

                ctx.save();
                ctx.font = "bold 34px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillStyle = "#eafffb";
                ctx.shadowColor = "#7dffe0";
                ctx.shadowBlur = 16;
                ctx.fillText(`${pad(state.score1)} - ${pad(state.score2)}`, CANVAS_W / 2, 58);
                ctx.restore();

                ctx.fillStyle = "rgba(186,255,242,0.35)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("FIRST TO 7", CANVAS_W / 2, 80);

                // Raquetes
                drawPaddle(PONG.LEFT, state.paddle1Y, "#39ff88");
                drawPaddle(PONG.RIGHT - PADDLE_W, state.paddle2Y, "#ff4d5a");

                // Rastro da bola
                for (let i = 0; i < state.ballTrail.length; i++) {
                    const t = state.ballTrail[i];
                    const a = ((i + 1) / state.ballTrail.length) * 0.20;
                    ctx.fillStyle = `rgba(234,255,251,${a})`;
                    ctx.beginPath();
                    ctx.arc(
                        t.x, t.y,
                        BALL_RADIUS * (0.25 + (i / state.ballTrail.length) * 0.75),
                        0, Math.PI * 2
                    );
                    ctx.fill();
                }

                // Bola
                if (state.running) {
                    const gradient = ctx.createRadialGradient(
                        state.ballX, state.ballY, 0,
                        state.ballX, state.ballY, BALL_RADIUS * 4
                    );
                    gradient.addColorStop(0, "rgba(234,255,251,0.35)");
                    gradient.addColorStop(1, "rgba(234,255,251,0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(state.ballX, state.ballY, BALL_RADIUS * 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#eafffb";
                    ctx.shadowColor = "#bafff2";
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    ctx.arc(state.ballX, state.ballY, BALL_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Contagem regressiva
                if (state.countdown > 0 && !state.gameOver) {
                    ctx.fillStyle = "rgba(0,8,8,0.30)";
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 86px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#7dffe0";
                    ctx.shadowBlur = 28;
                    ctx.fillText(state.countdown, CANVAS_W / 2, CANVAS_H / 2 - 6);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "rgba(186,255,242,0.65)";
                    ctx.font = "bold 12px 'Courier New', monospace";
                    ctx.fillText("GET READY", CANVAS_W / 2, CANVAS_H / 2 + 58);
                }

                // Aguardando conexão
                if (!connected) {
                    ctx.fillStyle = "rgba(0,8,8,0.68)";
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 26px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#7dffe0";
                    ctx.shadowBlur = 18;
                    ctx.fillText("WAITING FOR PLAYER", CANVAS_W / 2, CANVAS_H / 2 - 10);
                    ctx.shadowBlur = 0;

                    const blink = Math.sin(now / 300) > 0 ? "_" : " ";
                    ctx.fillStyle = "rgba(186,255,242,0.7)";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "AGUARDANDO CONEXÃO " + blink,
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 30
                    );
                }

                // Fim de jogo
                if (state.gameOver) {
                    ctx.fillStyle = "rgba(0,8,8,0.80)";
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 38px 'Courier New', monospace";
                    ctx.shadowColor = "#ffe14d";
                    ctx.shadowBlur = 22;
                    ctx.fillText("VITÓRIA", CANVAS_W / 2, CANVAS_H / 2 - 40);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 22px 'Courier New', monospace";
                    ctx.fillText(state.winner.toUpperCase(), CANVAS_W / 2, CANVAS_H / 2 + 4);

                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "13px 'Courier New', monospace";
                    ctx.fillText(
                        isHost
                            ? "ENTER PARA JOGAR NOVAMENTE"
                            : "AGUARDANDO O HOST REINICIAR",
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 44
                    );
                }

                endCRTScreen(now, "PONG");
            }

            // ══════════════════════════════════════
            //  Render — Tênis de Mesa
            // ══════════════════════════════════════

            // ══════════════════════════════════════
            //  CRT compartilhado (Pong, Tênis e Pesca)
            // ══════════════════════════════════════

            const CRT = {
                X: 38,
                Y: 16,
                W: CANVAS_W - 76,
                H: CANVAS_H - 32,
                R: 26
            };

            function drawCRTRoom() {
                // ── Fundo da sala ──
                ctx.fillStyle = "#050807";
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                const room = ctx.createRadialGradient(400, 240, 40, 400, 250, 520);
                room.addColorStop(0, "#101917");
                room.addColorStop(1, "#020303");
                ctx.fillStyle = room;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // Cabos
                ctx.strokeStyle = "#0a0f0e";
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(52, CANVAS_H - 8);
                ctx.bezierCurveTo(24, CANVAS_H + 8, 14, CANVAS_H - 2, 0, CANVAS_H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(CANVAS_W - 52, CANVAS_H - 8);
                ctx.bezierCurveTo(CANVAS_W - 24, CANVAS_H + 8, CANVAS_W - 14, CANVAS_H - 2, CANVAS_W, CANVAS_H);
                ctx.stroke();

                // ── Moldura do CRT ──
                roundRectPath(16, 6, CANVAS_W - 32, CANVAS_H - 12, 36);
                ctx.fillStyle = "#161b1a";
                ctx.fill();
                ctx.strokeStyle = "#2b3532";
                ctx.lineWidth = 5;
                ctx.stroke();

                roundRectPath(CRT.X - 8, CRT.Y - 8, CRT.W + 16, CRT.H + 16, 30);
                ctx.fillStyle = "#0a0f0e";
                ctx.fill();
                ctx.strokeStyle = "#0a2c2a";
                ctx.lineWidth = 10;
                ctx.stroke();
            }

            function beginCRTScreen(topColor, midColor, bottomColor) {
                drawCRTRoom();

                // ── Tela ──
                ctx.save();
                roundRectPath(CRT.X, CRT.Y, CRT.W, CRT.H, CRT.R);
                ctx.clip();

                const screen = ctx.createRadialGradient(400, 235, 30, 400, 245, 440);
                screen.addColorStop(0, topColor || "#073432");
                screen.addColorStop(0.52, midColor || "#031e1f");
                screen.addColorStop(1, bottomColor || "#010b0c");
                ctx.fillStyle = screen;
                ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                // Grade/phosphor
                ctx.strokeStyle = "rgba(57,255,136,0.025)";
                ctx.lineWidth = 1;
                for (let x = CRT.X; x < CRT.X + CRT.W; x += 24) {
                    ctx.beginPath();
                    ctx.moveTo(x, CRT.Y);
                    ctx.lineTo(x, CRT.Y + CRT.H);
                    ctx.stroke();
                }
                for (let y = CRT.Y; y < CRT.Y + CRT.H; y += 24) {
                    ctx.beginPath();
                    ctx.moveTo(CRT.X, y);
                    ctx.lineTo(CRT.X + CRT.W, y);
                    ctx.stroke();
                }
            }

            function drawCRTScanlines(now, tint = "120,255,220") {
                for (let y = CRT.Y; y < CRT.Y + CRT.H; y += 3) {
                    ctx.fillStyle = "rgba(0,0,0,0.16)";
                    ctx.fillRect(CRT.X, y, CRT.W, 1);
                }

                const bandY = CRT.Y + ((now * 0.035) % CRT.H);
                const band = ctx.createLinearGradient(0, bandY - 12, 0, bandY + 12);
                band.addColorStop(0, `rgba(${tint},0)`);
                band.addColorStop(0.5, `rgba(${tint},0.045)`);
                band.addColorStop(1, `rgba(${tint},0)`);
                ctx.fillStyle = band;
                ctx.fillRect(CRT.X, bandY - 12, CRT.W, 24);

                const vig = ctx.createRadialGradient(400, 250, 110, 400, 250, 430);
                vig.addColorStop(0, "rgba(0,0,0,0)");
                vig.addColorStop(0.7, "rgba(0,0,0,0.18)");
                vig.addColorStop(1, "rgba(0,0,0,0.72)");
                ctx.fillStyle = vig;
                ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                // Flicker sutil
                const flicker = 0.012 + Math.sin(now / 47) * 0.006;
                ctx.fillStyle = `rgba(${tint},${flicker})`;
                ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);
            }

            function drawCRTBezelDetails(now, label) {
                const screws = [
                    [36, 26],
                    [CANVAS_W - 36, 26],
                    [36, CANVAS_H - 26],
                    [CANVAS_W - 36, CANVAS_H - 26]
                ];

                for (const [x, y] of screws) {
                    ctx.fillStyle = "#0d1211";
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#394641";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x - 2, y);
                    ctx.lineTo(x + 2, y);
                    ctx.stroke();
                }

                const on = Math.sin(now / 500) > 0;
                ctx.fillStyle = on ? "#ff2a2a" : "#4a0a0a";
                ctx.shadowColor = "#ff2a2a";
                ctx.shadowBlur = on ? 12 : 0;
                ctx.beginPath();
                ctx.arc(CANVAS_W - 52, CANVAS_H - 22, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "rgba(186,255,242,0.22)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText(label || "CRT", CANVAS_W - 66, CANVAS_H - 21);
            }

            function endCRTScreen(now, label, tint) {
                drawCRTScanlines(now, tint);
                ctx.restore();
                drawCRTBezelDetails(now, label);
            }

            function drawFishHud(now) {
                ctx.textAlign = "center";

                ctx.font = "bold 13px 'Courier New', monospace";
