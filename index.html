                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // Cabos
                ctx.strokeStyle = "#0a0f0e";
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(52, CANVAS_H - 8);
                ctx.bezierCurveTo(24, CANVAS_H + 8, 14, CANVAS_H - 2, 0, CANVAS_H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(CANVAS_W - 52, CANVAS_H - 8);
                ctx.bezierCurveTo(CANVAS_W - 24, CANVAS_H + 8, CANVAS_W - 14, CANVAS_H - 2, CANVAS_W, CANVAS_H);
                ctx.stroke();

                // ── Moldura do CRT ──
                roundRectPath(16, 6, CANVAS_W - 32, CANVAS_H - 12, 36);
                ctx.fillStyle = "#161b1a";
                ctx.fill();
                ctx.strokeStyle = "#2b3532";
                ctx.lineWidth = 5;
                ctx.stroke();

                roundRectPath(SX - 8, SY - 8, SW + 16, SH + 16, 30);
                ctx.fillStyle = "#0a0f0e";
                ctx.fill();
                ctx.strokeStyle = "#0a2c2a";
                ctx.lineWidth = 10;
                ctx.stroke();

                // ── Tela ──
                ctx.save();
                roundRectPath(SX, SY, SW, SH, 26);
                ctx.clip();

                const screen = ctx.createRadialGradient(400, 235, 30, 400, 245, 440);
                screen.addColorStop(0, "#073432");
                screen.addColorStop(0.52, "#031e1f");
                screen.addColorStop(1, "#010b0c");
                ctx.fillStyle = screen;
                ctx.fillRect(SX, SY, SW, SH);

                // Grade/phosphor
                ctx.strokeStyle = "rgba(57,255,136,0.025)";
                ctx.lineWidth = 1;
                for (let x = SX; x < SX + SW; x += 24) {
                    ctx.beginPath();
                    ctx.moveTo(x, SY);
                    ctx.lineTo(x, SY + SH);
                    ctx.stroke();
                }
                for (let y = SY; y < SY + SH; y += 24) {
                    ctx.beginPath();
                    ctx.moveTo(SX, y);
                    ctx.lineTo(SX + SW, y);
                    ctx.stroke();
                }

                drawTTCourt(now);
                drawTTBall(now);
                drawTTHud(now);
                drawTTOverlays(now);
                drawTTScanlines(now);

                ctx.restore();

                // ── Detalhes da moldura ──
                drawTTBezelDetails(now);
            }

            // ── Quadra em perspectiva ──
            function drawTTCourt(now) {
                const left = TT.LEFT;
                const right = TT.RIGHT;
                const tableY = TT.TABLE_Y;
                const netX = TT.NET_X;
                const netTop = TT.NET_TOP;
                const tooHigh = TT.TOO_HIGH_Y;

                const localSide = isHost ? "p1" : "p2";
                const ballSide = tt.ballX < netX ? "p1" : "p2";
                const hittable = tt.phase === "rally" &&
                    ballSide === localSide &&
                    tt.ballY >= tooHigh &&
                    !(tt.lastHitter === localSide && !tt.crossedNet);

                const leftZone = [
                    [left, 194],
                    [netX - 14, 238],
                    [netX - 14, tableY],
                    [left, tableY]
                ];
                const rightZone = [
                    [netX + 14, 238],
                    [right, 194],
                    [right, tableY],
                    [netX + 14, tableY]
                ];

                const serveP1 = tt.phase === "serve" && tt.server === "p1";
                const serveP2 = tt.phase === "serve" && tt.server === "p2";

                const p1Glow = (localSide === "p1" && hittable) || serveP1 ? 0.10 : 0.055;
                const p2Glow = (localSide === "p2" && hittable) || serveP2 ? 0.10 : 0.055;

                fillZone(leftZone, `rgba(57,255,136,${p1Glow})`);
                fillZone(rightZone, `rgba(255,77,90,${p2Glow})`);

                const p1Active = (ballSide === "p1" && tt.phase === "rally") || serveP1;
                const p2Active = (ballSide === "p2" && tt.phase === "rally") || serveP2;

                const p1Pulse = 0.50 + (p1Active ? 0.12 * Math.sin(now / 160) : 0);
                const p2Pulse = 0.50 + (p2Active ? 0.12 * Math.sin(now / 160) : 0);

                strokeZone(leftZone, "#39ff88", p1Active ? 0.95 : p1Pulse, p1Active ? 3 : 2, p1Active ? 16 : 8);
                strokeZone(rightZone, "#ff4d5a", p2Active ? 0.95 : p2Pulse, p2Active ? 3 : 2, p2Active ? 16 : 8);

                // Linha da mesa
                ctx.save();
                ctx.strokeStyle = "rgba(186,255,242,0.78)";
                ctx.shadowColor = "#7dffe0";
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(left, tableY);
                ctx.lineTo(right, tableY);
                ctx.stroke();
                ctx.restore();

                // Linhas frontais decorativas
                ctx.strokeStyle = "rgba(186,255,242,0.12)";
                ctx.lineWidth = 1;
                for (const y of [tableY + 16, tableY + 32]) {
                    ctx.beginPath();
                    ctx.moveTo(left, y);
                    ctx.lineTo(right, y);
                    ctx.stroke();
                }
                for (let x = left; x <= right; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, tableY + 16);
                    ctx.lineTo(x, tableY + 21);
                    ctx.stroke();
                }

                // Linha pontilhada "muito alto"
                ctx.save();
                ctx.setLineDash([6, 8]);
                ctx.strokeStyle = "rgba(186,255,242,0.30)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(left, tooHigh);
                ctx.lineTo(right, tooHigh);
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = "rgba(186,255,242,0.32)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "right";
                ctx.textBaseline = "bottom";
                ctx.fillText("TOO HIGH", right, tooHigh - 4);

                // Rede
                ctx.save();
                ctx.strokeStyle = tt.netFlash > 0
                    ? "#ff4d5a"
                    : "rgba(234,255,251,0.9)";
                ctx.shadowColor = tt.netFlash > 0 ? "#ff4d5a" : "#bafff2";
                ctx.shadowBlur = tt.netFlash > 0 ? 26 : 12;
                ctx.lineWidth = tt.netFlash > 0 ? 4 : 2.5;
                ctx.beginPath();
                ctx.moveTo(netX, netTop);
                ctx.lineTo(netX, tableY + 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(netX - 9, netTop);
                ctx.lineTo(netX + 9, netTop);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(netX - 11, tableY + 2);
                ctx.lineTo(netX + 11, tableY + 2);
                ctx.stroke();
                ctx.restore();

                // Malha da rede
                ctx.fillStyle = "rgba(186,255,242,0.16)";
                for (let y = netTop + 6; y < tableY; y += 6) {
                    for (let x = netX - 6; x <= netX + 6; x += 4) {
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            function fillZone(points, color) {
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            function strokeZone(points, color, alpha, width, blur) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                ctx.closePath();
                ctx.strokeStyle = color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = width;
                ctx.shadowColor = color;
                ctx.shadowBlur = blur;
                ctx.stroke();
                ctx.restore();
            }

            // ── Bola ──
            function drawTTBall(now) {
                if (tt.phase === "gameover") return;

                if (tt.phase === "serve" && !tt.serveTossed) {
                    const bob = Math.sin(now / 260) * 2;
                    drawTTBallShadow();
                    drawBallAt(tt.ballX, tt.ballY + bob, 0.38);
                    ctx.fillStyle = "rgba(186,255,242,0.42)";
                    ctx.font = "9px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText("SAQUE", tt.ballX, tt.ballY - 18);
                    return;
                }

                drawTTBallShadow();

                for (let i = 0; i < tt.ballTrail.length; i++) {
                    const p = tt.ballTrail[i];
                    const a = ((i + 1) / tt.ballTrail.length) * 0.20;
                    ctx.fillStyle = `rgba(186,255,242,${a})`;
                    ctx.beginPath();
                    ctx.arc(
                        p.x,
                        p.y,
                        TT.BALL_R * (0.3 + (i / tt.ballTrail.length) * 0.7),
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }

                const tooHigh = tt.ballY < TT.TOO_HIGH_Y;
                drawBallAt(tt.ballX, tt.ballY, tooHigh ? 0.45 : 1);

                if (tooHigh) {
                    ctx.fillStyle = "rgba(255,225,77,0.8)";
                    ctx.font = "10px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        "TOO HIGH",
                        tt.ballX,
                        Math.max(32, tt.ballY - 14)
                    );
                }
            }

            function drawBallAt(x, y, alpha) {
                const r = TT.BALL_R;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowColor = "#d8fff6";
                ctx.shadowBlur = 20;
                ctx.fillStyle = "#eafffb";
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                ctx.beginPath();
                ctx.arc(x - 1.5, y - 1.5, r * 0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawTTBallShadow() {
                const t = clamp(
                    (tt.ballY - TT.TOO_HIGH_Y) / (TT.TABLE_Y - TT.TOO_HIGH_Y),
                    0,
                    1
                );

                ctx.fillStyle = `rgba(0,0,0,${0.08 + t * 0.20})`;
                ctx.beginPath();
                ctx.ellipse(
                    tt.ballX,
                    TT.TABLE_Y - 3,
                    12,
                    4,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            // ── HUD ──
            function drawTTHud(now) {
                const left = TT.LEFT;
                const right = TT.RIGHT;

                // Painel de nomes/placar
                ctx.fillStyle = "rgba(0,0,0,0.45)";
                ctx.fillRect(70, 52, 200, 54);
                ctx.strokeStyle = "rgba(186,255,242,0.18)";
                ctx.lineWidth = 1;
                ctx.strokeRect(70, 52, 200, 54);

                const p1Name = isHost ? myName : otherName;
                const p2Name = isHost ? otherName : myName;

                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.textBaseline = "middle";

                ctx.textAlign = "left";
                ctx.fillStyle = "#39ff88";
                ctx.fillText(p1Name.toUpperCase().slice(0, 14), 80, 70);
                ctx.textAlign = "right";
                ctx.fillStyle = "#eafffb";
                ctx.fillText(tt.score1, 258, 70);

                ctx.textAlign = "left";
                ctx.fillStyle = "#ff4d5a";
                ctx.fillText(p2Name.toUpperCase().slice(0, 14), 80, 94);
                ctx.textAlign = "right";
                ctx.fillStyle = "#eafffb";
                ctx.fillText(tt.score2, 258, 94);

                // Placar grande
                const pad = n => String(n).padStart(2, "0");
                ctx.save();
                ctx.font = "bold 38px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#eafffb";
                ctx.shadowColor = "#7dffe0";
                ctx.shadowBlur = 18;
                ctx.fillText(`${pad(tt.score1)} - ${pad(tt.score2)}`, CANVAS_W / 2, 80);
                ctx.restore();

                if (tt.phase === "serve" && connected) {
                    const serverName = tt.server === "p1" ? p1Name : p2Name;
                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "11px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "top";
                    ctx.fillText(
                        "SAQUE: " + serverName.toUpperCase(),
                        CANVAS_W / 2,
                        106
                    );
                }

                // Stamina local
                const stW = 170;
                const stH = 7;
                const stX = left;
                const stY = 438;
                ctx.fillStyle = "rgba(186,255,242,0.12)";
                ctx.fillRect(stX, stY, stW, stH);

                const stPct = tt.stamina / TT.STAMINA_MAX;
                const stColor = stPct > 0.5
                    ? "#39ff88"
                    : stPct > 0.25
                        ? "#ffe14d"
                        : "#ff4d5a";

                ctx.fillStyle = stColor;
                ctx.shadowColor = stColor;
                ctx.shadowBlur = 8;
                ctx.fillRect(stX, stY, stW * stPct, stH);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "rgba(186,255,242,0.55)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "left";
                ctx.textBaseline = "bottom";
                ctx.fillText("STAMINA", stX, stY - 4);

                // Carga local
                if (tt.charging) {
                    const cw = 230;
                    const ch = 9;
                    const cx = (CANVAS_W - cw) / 2;
                    const cy = 438;

                    ctx.fillStyle = "rgba(186,255,242,0.12)";
                    ctx.fillRect(cx, cy, cw, ch);

                    const grad = ctx.createLinearGradient(cx, 0, cx + cw, 0);
                    grad.addColorStop(0, "#39ff88");
                    grad.addColorStop(0.65, "#ffe14d");
                    grad.addColorStop(1, "#ff4d5a");
                    ctx.fillStyle = grad;
                    ctx.fillRect(cx, cy, cw * tt.charge, ch);

                    ctx.strokeStyle = "rgba(234,255,251,0.45)";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(cx, cy, cw, ch);

                    const label = tt.chargeShot === "forehand" ? "FOREHAND" : "LOB";
                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 11px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        label + "  " + Math.round(tt.charge * 100) + "%",
                        CANVAS_W / 2,
                        cy - 5
                    );

                    const ballSide = tt.ballX < TT.NET_X ? "p1" : "p2";
                    const localSide = isHost ? "p1" : "p2";
                    const spikeReady =
                        tt.chargeShot === "forehand" &&
                        tt.charge > 0.5 &&
                        tt.ballVY < 1.4 &&
                        ballSide === localSide &&
                        tt.ballY >= TT.TOO_HIGH_Y;

                    if (spikeReady) {
                        ctx.fillStyle = "#ffe14d";
                        ctx.font = "bold 10px 'Courier New', monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText("SPIKE!", CANVAS_W / 2, 416);
                    }
                }

                // Carga do oponente
                if (tt.oppCharging && (tt.phase === "rally" || tt.phase === "serve")) {
                    const ow = 110;
                    const oh = 5;
                    const ox = isHost ? right - ow : left;
                    const oy = 416;
                    const shotName = tt.oppShot === "forehand" ? "FOREHAND" : "LOB";

                    ctx.fillStyle = "rgba(186,255,242,0.10)";
                    ctx.fillRect(ox, oy, ow, oh);
                    ctx.fillStyle = isHost ? "#ff4d5a" : "#39ff88";
                    ctx.fillRect(ox, oy, ow * tt.oppCharge, oh);

                    ctx.fillStyle = "rgba(186,255,242,0.45)";
                    ctx.font = "9px 'Courier New', monospace";
                    ctx.textAlign = isHost ? "right" : "left";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        "OPONENTE " + shotName,
                        isHost ? right : left,
                        oy - 4
                    );
                }

                // Instruções
                ctx.fillStyle = "rgba(234,255,251,0.75)";
                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(
                    "FOREHAND [LMB]   /   [RMB] LOB",
                    CANVAS_W / 2,
                    458
                );
                ctx.fillStyle = "rgba(186,255,242,0.45)";
                ctx.font = "10px 'Courier New', monospace";
                ctx.fillText("HOLD TO CHARGE", CANVAS_W / 2, 473);

                // Feedback
                if (tt.feedback) {
                    ctx.fillStyle = "rgba(255,225,77,0.85)";
                    ctx.font = "bold 13px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(tt.feedback, CANVAS_W / 2, 402);
                }
            }

            // ── Overlays ──
            function drawTTOverlays(now) {
                if (tt.screenFlash > 0) {
                    ctx.fillStyle = `rgba(186,255,242,${tt.screenFlash * 0.10})`;
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                }

                if (!connected) {
                    ctx.fillStyle = "rgba(0,8,8,0.62)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 26px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#7dffe0";
                    ctx.shadowBlur = 18;
                    ctx.fillText("WAITING FOR PLAYER", CANVAS_W / 2, CANVAS_H / 2 - 10);
                    ctx.shadowBlur = 0;

                    const blink = Math.sin(now / 300) > 0 ? "_" : " ";
                    ctx.fillStyle = "rgba(186,255,242,0.7)";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "AGUARDANDO CONEXÃO " + blink,
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 30
                    );
                    return;
                }

                if (tt.phase === "point") {
                    ctx.fillStyle = "rgba(0,8,8,0.35)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = tt.pointMessageColor;
                    ctx.font = "bold 34px 'Courier New', monospace";
                    ctx.shadowColor = tt.pointMessageColor;
                    ctx.shadowBlur = 20;
                    ctx.fillText(tt.pointMessage, CANVAS_W / 2, CANVAS_H / 2 - 20);
                    ctx.shadowBlur = 0;

                    const winnerName = tt.lastPoint === "p1"
                        ? (isHost ? myName : otherName)
                        : (isHost ? otherName : myName);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "PONTO DE " + winnerName.toUpperCase(),
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 22
                    );
                }

                if (tt.phase === "gameover") {
                    ctx.fillStyle = "rgba(0,8,8,0.78)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 38px 'Courier New', monospace";
                    ctx.shadowColor = "#ffe14d";
                    ctx.shadowBlur = 22;
                    ctx.fillText("VITÓRIA", CANVAS_W / 2, CANVAS_H / 2 - 40);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 22px 'Courier New', monospace";
                    ctx.fillText(tt.winner.toUpperCase(), CANVAS_W / 2, CANVAS_H / 2 + 4);

                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "13px 'Courier New', monospace";
                    ctx.fillText(
                        isHost
                            ? "ENTER PARA JOGAR NOVAMENTE"
                            : "AGUARDANDO O HOST REINICIAR",
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 44
                    );
                }
            }

            // ── Scanlines, brilho e vinheta ──
            function drawTTScanlines(now) {
                const SX = 38;
                const SY = 16;
                const SW = CANVAS_W - 76;
                const SH = CANVAS_H - 32;

                for (let y = SY; y < SY + SH; y += 3) {
                    ctx.fillStyle = "rgba(0,0,0,0.16)";
                    ctx.fillRect(SX, y, SW, 1);
                }

                const bandY = SY + ((now * 0.035) % SH);
                const band = ctx.createLinearGradient(0, bandY - 12, 0, bandY + 12);
                band.addColorStop(0, "rgba(120,255,220,0)");
                band.addColorStop(0.5, "rgba(120,255,220,0.045)");
                band.addColorStop(1, "rgba(120,255,220,0)");
                ctx.fillStyle = band;
                ctx.fillRect(SX, bandY - 12, SW, 24);

                const vig = ctx.createRadialGradient(400, 250, 110, 400, 250, 430);
                vig.addColorStop(0, "rgba(0,0,0,0)");
                vig.addColorStop(0.7, "rgba(0,0,0,0.18)");
                vig.addColorStop(1, "rgba(0,0,0,0.72)");
                ctx.fillStyle = vig;
                ctx.fillRect(SX, SY, SW, SH);

                // Flicker sutil
                const flicker = 0.012 + Math.sin(now / 47) * 0.006;
                ctx.fillStyle = `rgba(120,255,220,${flicker})`;
                ctx.fillRect(SX, SY, SW, SH);
            }

            function drawTTBezelDetails(now) {
                const screws = [
                    [36, 26],
                    [CANVAS_W - 36, 26],
                    [36, CANVAS_H - 26],
                    [CANVAS_W - 36, CANVAS_H - 26]
                ];

                for (const [x, y] of screws) {
                    ctx.fillStyle = "#0d1211";
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#394641";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x - 2, y);
                    ctx.lineTo(x + 2, y);
                    ctx.stroke();
                }

                const on = Math.sin(now / 500) > 0;
                ctx.fillStyle = on ? "#ff2a2a" : "#4a0a0a";
                ctx.shadowColor = "#ff2a2a";
                ctx.shadowBlur = on ? 12 : 0;
                ctx.beginPath();
                ctx.arc(CANVAS_W - 52, CANVAS_H - 22, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "rgba(186,255,242,0.22)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText("TENNIS FOR TWO", CANVAS_W - 66, CANVAS_H - 21);
            }

            // ══════════════════════════════════════
            //  Reiniciar partida de Tênis de Mesa (host)
            // ══════════════════════════════════════

            window.addEventListener("keydown", e => {
                if (
                    e.key === "Enter" &&
                    currentMinigame === "tableTennis" &&
                    isHost &&
                    tt.gameOver &&
                    connected
                ) {
                    resetTTMatch(false);
                    broadcastTTState();
                }
            });

            // ══════════════════════════════════════
            //  Desenhar raquete do Pong
            // ══════════════════════════════════════

            function drawPaddle(x, y, color) {
                const baseY = y;
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = color;

                const r = 4;
                ctx.beginPath();
                ctx.moveTo(x + r, baseY);
                ctx.lineTo(x + PADDLE_W - r, baseY);
                ctx.quadraticCurveTo(x + PADDLE_W, baseY, x + PADDLE_W, baseY + r);
                ctx.lineTo(x + PADDLE_W, baseY + PADDLE_H - r);
                ctx.quadraticCurveTo(x + PADDLE_W, baseY + PADDLE_H, x + PADDLE_W - r, baseY + PADDLE_H);
                ctx.lineTo(x + r, baseY + PADDLE_H);
                ctx.quadraticCurveTo(x, baseY + PADDLE_H, x, baseY + PADDLE_H - r);
                ctx.lineTo(x, baseY + r);
                ctx.quadraticCurveTo(x, baseY, x + r, baseY);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // ══════════════════════════════════════
            //  Utilitário
            // ══════════════════════════════════════

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function roundRectPath(x, y, w, h, r) {
                const rr = Math.min(r, w / 2, h / 2);

                ctx.beginPath();
                ctx.moveTo(x + rr, y);
                ctx.arcTo(x + w, y, x + w, y + h, rr);
                ctx.arcTo(x + w, y + h, x, y + h, rr);
                ctx.arcTo(x, y + h, x, y, rr);
                ctx.arcTo(x, y, x + w, y, rr);
                ctx.closePath();
            }

            // ══════════════════════════════════════
            //  Iniciar
            // ══════════════════════════════════════

            updateInfoText();
            updateScoreDisplay();
            updateNameDisplays();
            resetBall();
            resetTTMatch(true);

            // Link direto para o Tênis: index.html?game=tt
            const gameFromUrl = urlParams.get("game");
            if (gameFromUrl === "tt" || gameFromUrl === "tableTennis") {
                switchMinigame("tableTennis", false);
            }

            requestAnimationFrame(gameLoop);

        })();
    </script>
