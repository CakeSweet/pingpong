<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🏓 Ping Pong Multiplayer</title>

    <!-- Favicon emoji 🏓 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 26px;
            margin-top: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }

        /* ── Menu ── */
        #menu {
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #menu input {
            background: #1a1a2e;
            border: 1px solid #00e5ff;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 240px;
            outline: none;
            transition: border-color 0.3s;
        }

        #menu input:focus {
            border-color: #76ff03;
        }

        #menu button {
            background: linear-gradient(135deg, #00e5ff, #0077b6);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            letter-spacing: 1px;
        }

        #menu button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        #status {
            font-size: 12px;
            color: #aaa;
            width: 100%;
            text-align: center;
            margin-top: 2px;
        }

        /* ── Nome do jogador ── */
        #nameRow {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-bottom: 6px;
        }

        #nameRow label {
            font-size: 13px;
            color: #888;
        }

        #nameInput {
            background: #1a1a2e;
            border: 1px solid #444;
            color: #00e5ff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
            width: 160px;
            outline: none;
            transition: border-color 0.3s;
        }

        #nameInput:focus {
            border-color: #00e5ff;
        }

        /* ── Layout principal ── */
        #mainArea {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-top: 4px;
        }

        /* ── Coluna do jogo ── */
        #gameCol {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #00e5ff;
            border-radius: 4px;
            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
        }

        /* ── Scoreboard ── */
        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 17px;
            margin-top: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #scoreboard .p1 {
            color: #00e5ff;
        }

        #scoreboard .p2 {
            color: #ff1744;
        }

        #info {
            margin-top: 6px;
            font-size: 11px;
            color: #555;
        }

        /* ── Chat ── */
        #chatPanel {
            width: 280px;
            height: 504px;
            display: flex;
            flex-direction: column;
            background: #111318;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
        }

        #chatHeader {
            background: #161b22;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            color: #00e5ff;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #chatMessages::-webkit-scrollbar {
            width: 5px;
        }

        #chatMessages::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatMessages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .chat-msg {
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg .sender {
            font-weight: bold;
            margin-right: 4px;
        }

        .chat-msg .sender.p1 {
            color: #00e5ff;
        }

        .chat-msg .sender.p2 {
            color: #ff1744;
        }

        .chat-msg .text {
            color: #ccc;
        }

        .chat-msg.system {
            color: #666;
            font-style: italic;
            font-size: 12px;
        }

        #chatInputRow {
            display: flex;
            border-top: 1px solid #222;
        }

        #chatInput {
            flex: 1;
            background: #0d1117;
            border: none;
            color: white;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
        }

        #chatInput::placeholder {
            color: #444;
        }

        #chatSendBtn {
            background: #00e5ff;
            border: none;
            color: #000;
            padding: 10px 14px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #chatSendBtn:hover {
            background: #00b8d4;
        }
    </style>
</head>

<body>

    <h1>🏓 Ping Pong</h1>

    <div id="menu">

        <button id="hostButton">
            Criar Sala
        </button>

        <input
            id="roomId"
            placeholder="Cole o ID da sala aqui"
        >

        <button id="joinButton">
            Entrar
        </button>

        <div id="status">
            Iniciando...
        </div>

    </div>

    <div id="nameRow">
        <label>Seu nome:</label>
        <input
            id="nameInput"
            placeholder="Jogador"
            maxlength="20"
        >
    </div>

    <div id="mainArea">

        <!-- Coluna do jogo -->
        <div id="gameCol">
            <canvas
                id="gameCanvas"
                width="800"
                height="500"
            ></canvas>

            <div id="scoreboard">
                <span class="p1"><span id="name1Display">Jogador 1</span>: <span id="score1">0</span></span>
                <span class="p2"><span id="name2Display">Jogador 2</span>: <span id="score2">0</span></span>
            </div>

            <div id="info">
                W / S ou ↑ / ↓ para mover a raquete
            </div>
        </div>

        <!-- Painel de chat -->
        <div id="chatPanel">
            <div id="chatHeader">💬 Chat</div>
            <div id="chatMessages"></div>
            <div id="chatInputRow">
                <input
                    id="chatInput"
                    placeholder="Digite uma mensagem..."
                    maxlength="200"
                >
                <button id="chatSendBtn">Enviar</button>
            </div>
        </div>

    </div>

    <script>
        (() => {

            // ══════════════════════════════════════
            //  Configurações do jogo
            // ══════════════════════════════════════

            const CANVAS_W = 800;
            const CANVAS_H = 500;

            const PADDLE_W = 12;
            const PADDLE_H = 90;
            const PADDLE_SPEED = 6;
            const PADDLE_MARGIN = 20;

            const BALL_RADIUS = 8;
            const BALL_INITIAL_SPEED = 5;
            const BALL_MAX_SPEED = 12;
            const BALL_ACCELERATION = 0.3;

            const WINNING_SCORE = 7;

            // ══════════════════════════════════════
            //  Sistema de Áudio (Web Audio API)
            // ══════════════════════════════════════

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;

            function ensureAudio() {
                if (!audioCtx) {
                    audioCtx = new AudioCtx();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // ── Utilitários de áudio clean ──

            // Nota limpa com sine + envelope suave (attack/release)
            function cleanTone(freq, duration, vol = 0.12, attack = 0.01, release = null) {
                const ctx = ensureAudio();
                const t = ctx.currentTime;
                const rel = release !== null ? release : duration * 0.7;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, t);

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(vol, t + attack);
                gain.gain.setValueAtTime(vol, t + duration - rel);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + duration + 0.05);
            }

            // Nota com pitch sweep (para efeitos de impacto suaves)
            function sweepTone(startFreq, endFreq, duration, vol = 0.1) {
                const ctx = ensureAudio();
                const t = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                osc.type = "sine";
                osc.frequency.setValueAtTime(startFreq, t);
                osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);

                filter.type = "lowpass";
                filter.frequency.setValueAtTime(3000, t);
                filter.Q.value = 1;

                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + duration + 0.05);
            }

            // Ruído filtrado suave (para texturas sutis)
            function softNoise(duration, vol = 0.03, cutoff = 2000) {
                const ctx = ensureAudio();
                const t = ctx.currentTime;
                const len = ctx.sampleRate * duration;
                const buf = ctx.createBuffer(1, len, ctx.sampleRate);
                const ch = buf.getChannelData(0);
                for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;

                const src = ctx.createBufferSource();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                src.buffer = buf;
                filter.type = "bandpass";
                filter.frequency.value = cutoff;
                filter.Q.value = 0.5;

                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                src.start(t);
            }

            // ── Sons do jogo ──

            function sfxPaddleHit() {
                // Pop limpo: sine rápido com pitch drop + toque de ruído filtrado
                sweepTone(600, 200, 0.1, 0.13);
                softNoise(0.06, 0.03, 3000);
            }

            function sfxWallBounce() {
                // Toque suave e sutil
                sweepTone(400, 150, 0.08, 0.07);
            }

            function sfxGoal() {
                // Impacto grave e profundo com reverb natural
                sweepTone(300, 60, 0.6, 0.15);
                cleanTone(120, 0.5, 0.08, 0.01, 0.4);
                softNoise(0.3, 0.04, 800);
            }

            function sfxCountdownTick() {
                // Ping cristalino
                cleanTone(880, 0.2, 0.1, 0.005, 0.15);
                cleanTone(1760, 0.15, 0.03, 0.005, 0.12);
            }

            function sfxCountdownGo() {
                // Acorde brilhante de início
                cleanTone(880, 0.3, 0.1, 0.005, 0.25);
                cleanTone(1108, 0.3, 0.07, 0.005, 0.25);
                cleanTone(1318, 0.35, 0.08, 0.005, 0.28);
            }

            function sfxConnect() {
                // Chime ascendente elegante (3 notas)
                cleanTone(659, 0.25, 0.1, 0.01, 0.2);
                setTimeout(() => cleanTone(880, 0.25, 0.1, 0.01, 0.2), 120);
                setTimeout(() => cleanTone(1175, 0.4, 0.12, 0.01, 0.3), 240);
            }

            function sfxDisconnect() {
                // Tom descendente suave
                cleanTone(660, 0.25, 0.08, 0.01, 0.2);
                setTimeout(() => cleanTone(494, 0.25, 0.07, 0.01, 0.2), 150);
                setTimeout(() => cleanTone(330, 0.5, 0.06, 0.01, 0.4), 300);
            }

            function sfxWin() {
                // Fanfarra clean com acordes
                const melody = [
                    { f: 523, d: 0.2, t: 0 },
                    { f: 659, d: 0.2, t: 150 },
                    { f: 784, d: 0.2, t: 300 },
                    { f: 1047, d: 0.5, t: 450 },
                    // Harmonias
                    { f: 1318, d: 0.5, t: 450 },
                    { f: 1568, d: 0.6, t: 500 },
                ];
                melody.forEach(n => {
                    setTimeout(() => cleanTone(n.f, n.d, 0.08, 0.01, n.d * 0.7), n.t);
                });
            }

            function sfxChatMsg() {
                // Notificação sutil e discreta
                cleanTone(1200, 0.1, 0.05, 0.005, 0.08);
                setTimeout(() => cleanTone(1500, 0.08, 0.03, 0.005, 0.06), 50);
            }

            // ══════════════════════════════════════
            //  Canvas & contexto
            // ══════════════════════════════════════

            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");

            // ══════════════════════════════════════
            //  PeerJS / conexão P2P
            // ══════════════════════════════════════

            const peer = new Peer();
            let connection = null;
            let isHost = false;
            let connected = false;

            const statusEl = document.getElementById("status");
            const roomInput = document.getElementById("roomId");
            const score1El = document.getElementById("score1");
            const score2El = document.getElementById("score2");
            const name1El = document.getElementById("name1Display");
            const name2El = document.getElementById("name2Display");
            const nameInput = document.getElementById("nameInput");

            // ══════════════════════════════════════
            //  Nomes dos jogadores
            // ══════════════════════════════════════

            let myName = "Jogador";
            let otherName = "Jogador";

            // Atualizar nome ao digitar
            nameInput.addEventListener("input", () => {
                myName = nameInput.value.trim() || "Jogador";
                updateNameDisplays();
                // Enviar nome para o outro jogador
                if (connection && connection.open) {
                    connection.send({ type: "nameChange", name: myName });
                }
            });

            function updateNameDisplays() {
                if (isHost) {
                    name1El.textContent = myName;
                    name2El.textContent = otherName;
                } else {
                    name1El.textContent = otherName;
                    name2El.textContent = myName;
                }
            }

            // ══════════════════════════════════════
            //  Chat
            // ══════════════════════════════════════

            const chatMessages = document.getElementById("chatMessages");
            const chatInput = document.getElementById("chatInput");
            const chatSendBtn = document.getElementById("chatSendBtn");

            function addChatMessage(senderName, text, playerClass) {
                const div = document.createElement("div");
                div.className = "chat-msg";
                div.innerHTML = `<span class="sender ${playerClass}">${escapeHtml(senderName)}:</span><span class="text">${escapeHtml(text)}</span>`;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function addSystemMessage(text) {
                const div = document.createElement("div");
                div.className = "chat-msg system";
                div.textContent = text;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            function sendChatMessage() {
                const text = chatInput.value.trim();
                if (!text || !connection || !connection.open) return;

                const playerClass = isHost ? "p1" : "p2";
                addChatMessage(myName, text, playerClass);

                connection.send({
                    type: "chatMessage",
                    name: myName,
                    text: text
                });

                chatInput.value = "";
            }

            chatSendBtn.addEventListener("click", sendChatMessage);

            chatInput.addEventListener("keydown", e => {
                // Impedir que teclas do chat afetem o jogo
                e.stopPropagation();
                if (e.key === "Enter") {
                    sendChatMessage();
                }
            });

            // Impedir que keyup do chat afete o jogo
            chatInput.addEventListener("keyup", e => {
                e.stopPropagation();
            });

            // Impedir que o nameInput afete o jogo
            nameInput.addEventListener("keydown", e => {
                e.stopPropagation();
            });
            nameInput.addEventListener("keyup", e => {
                e.stopPropagation();
            });

            // ══════════════════════════════════════
            //  Estado do jogo
            // ══════════════════════════════════════

            // Estado anterior do guest (para detectar mudanças e tocar sons)
            const prevState = {
                countdown: 0,
                score1: 0,
                score2: 0,
                running: false,
                gameOver: false
            };

            const state = {
                paddle1Y: CANVAS_H / 2 - PADDLE_H / 2,   // host (esquerda)
                paddle2Y: CANVAS_H / 2 - PADDLE_H / 2,   // guest (direita)

                ballX: CANVAS_W / 2,
                ballY: CANVAS_H / 2,
                ballVX: BALL_INITIAL_SPEED,
                ballVY: BALL_INITIAL_SPEED * 0.6,

                score1: 0,
                score2: 0,

                running: false,
                gameOver: false,
                winner: "",

                countdown: 0   // 3, 2, 1...
            };

            // ══════════════════════════════════════
            //  Input do teclado
            // ══════════════════════════════════════

            const keys = {};

            window.addEventListener("keydown", e => {
                keys[e.key.toLowerCase()] = true;
                // Prevenir scroll com setas
                if (["arrowup", "arrowdown"].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                }
            });

            window.addEventListener("keyup", e => {
                keys[e.key.toLowerCase()] = false;
            });

            // ══════════════════════════════════════
            //  Botões de menu
            // ══════════════════════════════════════

            document.getElementById("hostButton")
                .addEventListener("click", () => {
                    if (!peer.id) {
                        statusEl.textContent = "Aguardando PeerJS...";
                        return;
                    }

                    isHost = true;
                    roomInput.value = peer.id;
                    statusEl.textContent = "Sala criada! Compartilhe o ID: " + peer.id;
                    updateNameDisplays();

                    // Copiar para clipboard
                    navigator.clipboard.writeText(peer.id).catch(() => {});
                });

            document.getElementById("joinButton")
                .addEventListener("click", () => {
                    const roomId = roomInput.value.trim();
                    if (!roomId) return;

                    isHost = false;
                    connection = peer.connect(roomId, { reliable: true });
                    configureConnection();
                    statusEl.textContent = "Conectando...";
                    updateNameDisplays();
                });

            // Host recebe conexão
            peer.on("connection", conn => {
                connection = conn;
                configureConnection();
            });

            peer.on("open", id => {
                statusEl.textContent = "Pronto. Crie uma sala ou entre em uma.";
            });

            peer.on("error", err => {
                statusEl.textContent = "Erro: " + err.type;
            });

            // ══════════════════════════════════════
            //  Configuração da conexão P2P
            // ══════════════════════════════════════

            function configureConnection() {

                connection.on("open", () => {
                    connected = true;
                    statusEl.textContent = "Conectado! Preparando...";
                    sfxConnect();
                    addSystemMessage("Jogador conectado!");

                    // Enviar meu nome ao outro jogador
                    connection.send({ type: "nameChange", name: myName });

                    if (isHost) {
                        startCountdown();
                    }
                });

                connection.on("data", data => {

                    switch (data.type) {

                        // O guest envia a posição da sua raquete
                        case "paddleMove":
                            if (isHost) {
                                state.paddle2Y = data.y;
                            }
                            break;

                        // O host envia a posição da raquete dele
                        case "hostPaddle":
                            if (!isHost) {
                                state.paddle1Y = data.y;
                            }
                            break;

                        // O host envia eventos de som para o guest
                        case "sfx":
                            if (!isHost) {
                                switch (data.sfx) {
                                    case "paddleHit": sfxPaddleHit(); break;
                                    case "wallBounce": sfxWallBounce(); break;
                                }
                            }
                            break;

                        // Mudança de nome do outro jogador
                        case "nameChange":
                            otherName = data.name || "Jogador";
                            updateNameDisplays();
                            break;

                        // Mensagem de chat
                        case "chatMessage":
                            const senderClass = isHost ? "p2" : "p1";
                            addChatMessage(data.name, data.text, senderClass);
                            sfxChatMsg();
                            break;

                        // O host envia o estado completo da bola e placar
                        case "gameState":
                            if (!isHost) {
                                // Detectar mudanças para tocar sons no guest
                                const newCountdown = data.countdown || 0;
                                const newScore1 = data.score1;
                                const newScore2 = data.score2;

                                // Som de contagem regressiva
                                if (newCountdown > 0 && newCountdown !== prevState.countdown) {
                                    sfxCountdownTick();
                                }
                                // Som de "GO!" quando countdown acaba e jogo começa
                                if (prevState.countdown > 0 && newCountdown === 0 && data.running) {
                                    sfxCountdownGo();
                                }
                                // Som de gol
                                if (newScore1 > prevState.score1 || newScore2 > prevState.score2) {
                                    sfxGoal();
                                }
                                // Som de vitória
                                if (data.gameOver && !prevState.gameOver) {
                                    sfxWin();
                                }

                                prevState.countdown = newCountdown;
                                prevState.score1 = newScore1;
                                prevState.score2 = newScore2;
                                prevState.running = data.running;
                                prevState.gameOver = data.gameOver;

                                state.ballX = data.ballX;
                                state.ballY = data.ballY;
                                state.ballVX = data.ballVX;
                                state.ballVY = data.ballVY;
                                state.score1 = data.score1;
                                state.score2 = data.score2;
                                state.running = data.running;
                                state.gameOver = data.gameOver;
                                state.winner = data.winner || "";
                                state.countdown = data.countdown || 0;
                                updateScoreDisplay();
                            }
                            break;
                    }

                });

                connection.on("close", () => {
                    connected = false;
                    state.running = false;
                    statusEl.textContent = "Jogador desconectou.";
                    sfxDisconnect();
                    addSystemMessage(otherName + " desconectou.");
                });

            }

            // ══════════════════════════════════════
            //  Contagem regressiva (host controla)
            // ══════════════════════════════════════

            function startCountdown() {
                resetBall();
                state.running = false;
                state.gameOver = false;
                state.winner = "";
                state.countdown = 3;
                sfxCountdownTick();

                const interval = setInterval(() => {
                    state.countdown--;
                    if (state.countdown <= 0) {
                        clearInterval(interval);
                        state.running = true;
                        sfxCountdownGo();
                    } else {
                        sfxCountdownTick();
                    }
                    broadcastState();
                }, 1000);

                broadcastState();
            }

            // ══════════════════════════════════════
            //  Reset da bola
            // ══════════════════════════════════════

            function resetBall() {
                state.ballX = CANVAS_W / 2;
                state.ballY = CANVAS_H / 2;

                const direction = Math.random() > 0.5 ? 1 : -1;
                const angle = (Math.random() * 0.6 - 0.3); // -0.3 a 0.3 rad
                state.ballVX = BALL_INITIAL_SPEED * direction;
                state.ballVY = BALL_INITIAL_SPEED * Math.sin(angle);
            }

            // ══════════════════════════════════════
            //  Broadcast do estado (host → guest)
            // ══════════════════════════════════════

            // Envia evento de som para o guest tocar localmente
            function sendSfxEvent(sfxName) {
                if (connection && connection.open && isHost) {
                    connection.send({ type: "sfx", sfx: sfxName });
                }
            }

            function broadcastState() {
                if (connection && connection.open && isHost) {
                    connection.send({
                        type: "gameState",
                        ballX: state.ballX,
                        ballY: state.ballY,
                        ballVX: state.ballVX,
                        ballVY: state.ballVY,
                        score1: state.score1,
                        score2: state.score2,
                        running: state.running,
                        gameOver: state.gameOver,
                        winner: state.winner,
                        countdown: state.countdown
                    });
                }
            }

            // ══════════════════════════════════════
            //  Atualizar placar na tela
            // ══════════════════════════════════════

            function updateScoreDisplay() {
                score1El.textContent = state.score1;
                score2El.textContent = state.score2;
            }

            // ══════════════════════════════════════
            //  Loop principal
            // ══════════════════════════════════════

            let lastBroadcast = 0;
            const BROADCAST_INTERVAL = 1000 / 60; // ~60fps

            function gameLoop(timestamp) {

                // ── Mover minha raquete ──
                handleMyPaddle();

                // ── Física da bola (só o host calcula) ──
                if (isHost && state.running && !state.gameOver) {
                    updateBall();
                }

                // ── Broadcast periódico ──
                if (timestamp - lastBroadcast >= BROADCAST_INTERVAL) {
                    lastBroadcast = timestamp;

                    if (connected && isHost) {
                        // Host envia a posição da raquete dele
                        connection.send({
                            type: "hostPaddle",
                            y: state.paddle1Y
                        });
                        broadcastState();
                    }
                }

                // ── Desenhar ──
                render();

                requestAnimationFrame(gameLoop);
            }

            // ══════════════════════════════════════
            //  Mover a própria raquete
            // ══════════════════════════════════════

            function handleMyPaddle() {
                let moved = false;

                if (isHost) {
                    // Host controla paddle1 (esquerda)
                    if (keys["w"] || keys["arrowup"]) {
                        state.paddle1Y -= PADDLE_SPEED;
                        moved = true;
                    }
                    if (keys["s"] || keys["arrowdown"]) {
                        state.paddle1Y += PADDLE_SPEED;
                        moved = true;
                    }
                    state.paddle1Y = clamp(state.paddle1Y, 0, CANVAS_H - PADDLE_H);
                } else {
                    // Guest controla paddle2 (direita)
                    if (keys["w"] || keys["arrowup"]) {
                        state.paddle2Y -= PADDLE_SPEED;
                        moved = true;
                    }
                    if (keys["s"] || keys["arrowdown"]) {
                        state.paddle2Y += PADDLE_SPEED;
                        moved = true;
                    }
                    state.paddle2Y = clamp(state.paddle2Y, 0, CANVAS_H - PADDLE_H);

                    // Enviar posição para o host
                    if (moved && connection && connection.open) {
                        connection.send({
                            type: "paddleMove",
                            y: state.paddle2Y
                        });
                    }
                }
            }

            // ══════════════════════════════════════
            //  Física da bola (host only)
            // ══════════════════════════════════════

            function updateBall() {

                state.ballX += state.ballVX;
                state.ballY += state.ballVY;

                // ── Colisão topo/baixo ──
                if (state.ballY - BALL_RADIUS <= 0) {
                    state.ballY = BALL_RADIUS;
                    state.ballVY = Math.abs(state.ballVY);
                    sfxWallBounce();
                    sendSfxEvent("wallBounce");
                }
                if (state.ballY + BALL_RADIUS >= CANVAS_H) {
                    state.ballY = CANVAS_H - BALL_RADIUS;
                    state.ballVY = -Math.abs(state.ballVY);
                    sfxWallBounce();
                    sendSfxEvent("wallBounce");
                }

                // ── Colisão raquete esquerda (paddle1) ──
                const p1Left = PADDLE_MARGIN;
                const p1Right = PADDLE_MARGIN + PADDLE_W;
                const p1Top = state.paddle1Y;
                const p1Bottom = state.paddle1Y + PADDLE_H;

                if (
                    state.ballVX < 0 &&
                    state.ballX - BALL_RADIUS <= p1Right &&
                    state.ballX + BALL_RADIUS >= p1Left &&
                    state.ballY >= p1Top &&
                    state.ballY <= p1Bottom
                ) {
                    state.ballX = p1Right + BALL_RADIUS;

                    // Calcular ângulo baseado em onde bateu na raquete
                    const hitPos = (state.ballY - p1Top) / PADDLE_H; // 0..1
                    const angle = (hitPos - 0.5) * (Math.PI / 3);    // -60° a 60°

                    const speed = Math.min(
                        Math.sqrt(state.ballVX ** 2 + state.ballVY ** 2) + BALL_ACCELERATION,
                        BALL_MAX_SPEED
                    );
                    state.ballVX = speed * Math.cos(angle);
                    state.ballVY = speed * Math.sin(angle);
                    sfxPaddleHit();
                    sendSfxEvent("paddleHit");
                }

                // ── Colisão raquete direita (paddle2) ──
                const p2Left = CANVAS_W - PADDLE_MARGIN - PADDLE_W;
                const p2Right = CANVAS_W - PADDLE_MARGIN;
                const p2Top = state.paddle2Y;
                const p2Bottom = state.paddle2Y + PADDLE_H;

                if (
                    state.ballVX > 0 &&
                    state.ballX + BALL_RADIUS >= p2Left &&
                    state.ballX - BALL_RADIUS <= p2Right &&
                    state.ballY >= p2Top &&
                    state.ballY <= p2Bottom
                ) {
                    state.ballX = p2Left - BALL_RADIUS;

                    const hitPos = (state.ballY - p2Top) / PADDLE_H;
                    const angle = (hitPos - 0.5) * (Math.PI / 3);

                    const speed = Math.min(
                        Math.sqrt(state.ballVX ** 2 + state.ballVY ** 2) + BALL_ACCELERATION,
                        BALL_MAX_SPEED
                    );
                    state.ballVX = -(speed * Math.cos(angle));
                    state.ballVY = speed * Math.sin(angle);
                    sfxPaddleHit();
                    sendSfxEvent("paddleHit");
                }

                // ── Gol esquerdo (ponto para jogador 2) ──
                if (state.ballX - BALL_RADIUS <= 0) {
                    state.score2++;
                    updateScoreDisplay();
                    sfxGoal();
                    checkWin();
                    if (!state.gameOver) {
                        startCountdown();
                    }
                }

                // ── Gol direito (ponto para jogador 1) ──
                if (state.ballX + BALL_RADIUS >= CANVAS_W) {
                    state.score1++;
                    updateScoreDisplay();
                    sfxGoal();
                    checkWin();
                    if (!state.gameOver) {
                        startCountdown();
                    }
                }
            }

            // ══════════════════════════════════════
            //  Checar vitória
            // ══════════════════════════════════════

            function checkWin() {
                if (state.score1 >= WINNING_SCORE) {
                    state.gameOver = true;
                    state.running = false;
                    state.winner = isHost ? myName : otherName;
                    sfxWin();
                    broadcastState();
                } else if (state.score2 >= WINNING_SCORE) {
                    state.gameOver = true;
                    state.running = false;
                    state.winner = isHost ? otherName : myName;
                    sfxWin();
                    broadcastState();
                }
            }

            // ══════════════════════════════════════
            //  Reiniciar partida (host aperta Enter)
            // ══════════════════════════════════════

            window.addEventListener("keydown", e => {
                if (e.key === "Enter" && isHost && state.gameOver && connected) {
                    state.score1 = 0;
                    state.score2 = 0;
                    state.gameOver = false;
                    state.winner = "";
                    updateScoreDisplay();
                    startCountdown();
                }
            });

            // ══════════════════════════════════════
            //  Renderização (Canvas)
            // ══════════════════════════════════════

            function render() {
                // ── Fundo ──
                ctx.fillStyle = "#0d1117";
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // ── Linha central tracejada ──
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = "rgba(255,255,255,0.12)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(CANVAS_W / 2, 0);
                ctx.lineTo(CANVAS_W / 2, CANVAS_H);
                ctx.stroke();
                ctx.setLineDash([]);

                // ── Placar grande no fundo ──
                ctx.fillStyle = "rgba(255,255,255,0.04)";
                ctx.font = "bold 140px 'Segoe UI', Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(state.score1, CANVAS_W / 4, CANVAS_H / 2);
                ctx.fillText(state.score2, (CANVAS_W / 4) * 3, CANVAS_H / 2);

                // ── Nomes dos jogadores no topo do canvas ──
                ctx.font = "bold 14px 'Segoe UI', Arial";
                ctx.fillStyle = "rgba(0, 229, 255, 0.5)";
                ctx.textAlign = "center";
                ctx.fillText(name1El.textContent, CANVAS_W / 4, 20);
                ctx.fillStyle = "rgba(255, 23, 68, 0.5)";
                ctx.fillText(name2El.textContent, (CANVAS_W / 4) * 3, 20);

                // ── Raquete esquerda (Jogador 1) ──
                drawPaddle(PADDLE_MARGIN, state.paddle1Y, "#00e5ff");

                // ── Raquete direita (Jogador 2) ──
                drawPaddle(CANVAS_W - PADDLE_MARGIN - PADDLE_W, state.paddle2Y, "#ff1744");

                // ── Bola ──
                if (state.running) {
                    // Trilha da bola (glow)
                    const gradient = ctx.createRadialGradient(
                        state.ballX, state.ballY, 0,
                        state.ballX, state.ballY, BALL_RADIUS * 3
                    );
                    gradient.addColorStop(0, "rgba(255, 255, 255, 0.3)");
                    gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(state.ballX, state.ballY, BALL_RADIUS * 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Bola
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "#ffffff";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(state.ballX, state.ballY, BALL_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // ── Contagem regressiva ──
                if (state.countdown > 0 && !state.gameOver) {
                    ctx.fillStyle = "rgba(0, 229, 255, 0.9)";
                    ctx.font = "bold 80px 'Segoe UI', Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#00e5ff";
                    ctx.shadowBlur = 30;
                    ctx.fillText(state.countdown, CANVAS_W / 2, CANVAS_H / 2);
                    ctx.shadowBlur = 0;
                }

                // ── Mensagem de espera ──
                if (!connected) {
                    ctx.fillStyle = "rgba(255,255,255,0.5)";
                    ctx.font = "24px 'Segoe UI', Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Aguardando conexão...", CANVAS_W / 2, CANVAS_H / 2);
                }

                // ── Game Over ──
                if (state.gameOver) {
                    // Overlay escuro
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    // Texto de vitória
                    ctx.fillStyle = "#ffea00";
                    ctx.font = "bold 48px 'Segoe UI', Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#ffea00";
                    ctx.shadowBlur = 20;
                    ctx.fillText("🏆 " + state.winner + " venceu!", CANVAS_W / 2, CANVAS_H / 2 - 20);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "rgba(255,255,255,0.6)";
                    ctx.font = "18px 'Segoe UI', Arial";
                    ctx.fillText(
                        isHost ? "Pressione ENTER para jogar novamente" : "Aguardando host reiniciar...",
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 30
                    );
                }
            }

            // ══════════════════════════════════════
            //  Desenhar raquete com efeito glow
            // ══════════════════════════════════════

            function drawPaddle(x, y, color) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = color;

                // Raquete com bordas arredondadas
                const r = 4;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + PADDLE_W - r, y);
                ctx.quadraticCurveTo(x + PADDLE_W, y, x + PADDLE_W, y + r);
                ctx.lineTo(x + PADDLE_W, y + PADDLE_H - r);
                ctx.quadraticCurveTo(x + PADDLE_W, y + PADDLE_H, x + PADDLE_W - r, y + PADDLE_H);
                ctx.lineTo(x + r, y + PADDLE_H);
                ctx.quadraticCurveTo(x, y + PADDLE_H, x, y + PADDLE_H - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // ══════════════════════════════════════
            //  Utilitário
            // ══════════════════════════════════════

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            // ══════════════════════════════════════
            //  Iniciar game loop
            // ══════════════════════════════════════

            requestAnimationFrame(gameLoop);

        })();
    </script>

</body>
