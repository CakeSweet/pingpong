                    ctx.fillText(fish.feedback.toUpperCase(), CANVAS_W / 2, 37);
                } else {
                    ctx.fillStyle = "rgba(186,255,242,0.42)";
                    ctx.font = "8px 'Courier New', monospace";
                    ctx.fillText("PRIMEIRO A 3 PEIXES", CANVAS_W / 2, 37);
                }

                ctx.strokeStyle = "rgba(120,255,220,0.08)";
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 8]);
                ctx.beginPath();
                ctx.moveTo(CANVAS_W / 2, 46);
                ctx.lineTo(CANVAS_W / 2, 436);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "rgba(234,255,251,0.52)";
                ctx.font = "8px 'Courier New', monospace";
                ctx.fillText(
                    "LMB / ESPAÇO: SEGURE PARA LANÇAR · SOLTE · FISGUE NO ! · SEGURE PARA RECOLHER",
                    CANVAS_W / 2,
                    456
                );
            }

            function drawFishPanel(key, now) {
                const p = fish.panels[key];
                const px = FISH_UI.panelX[key];
                const pw = FISH_UI.panelW;
                const py = FISH_UI.panelY;
                const ph = FISH_UI.panelH;
                const p1 = key === "p1";
                const accent = p1 ? "#39ff88" : "#ff4d5a";
                const accentRGB = p1 ? "57,255,136" : "255,77,90";

                // Painel
                roundRectPath(px, py, pw, ph, 10);
                ctx.fillStyle = "rgba(0,10,12,0.50)";
                ctx.fill();
                ctx.strokeStyle = `rgba(${accentRGB},0.18)`;
                ctx.lineWidth = 1;
                ctx.stroke();

                const name = p1
                    ? (isHost ? myName : otherName)
                    : (isHost ? otherName : myName);
                const score = p1 ? fish.score1 : fish.score2;
                const value = p1 ? fish.value1 : fish.value2;
                const local = (isHost && p1) || (!isHost && !p1);

                ctx.textBaseline = "middle";

                ctx.textAlign = "left";
                ctx.fillStyle = accent;
                ctx.font = "bold 11px 'Courier New', monospace";
                ctx.fillText(name.toUpperCase().slice(0, 13), px + 10, 56);

                if (local) {
                    ctx.fillStyle = `rgba(${accentRGB},0.55)`;
                    ctx.font = "7px 'Courier New', monospace";
                    ctx.fillText("VOCÊ", px + 10, 69);
                }

                ctx.textAlign = "right";
                ctx.fillStyle = "#eafffb";
                ctx.font = "bold 15px 'Courier New', monospace";
                ctx.fillText(`${score} / ${FISH.WIN_COUNT}`, px + pw - 10, 55);

                ctx.fillStyle = "rgba(234,255,251,0.42)";
                ctx.font = "8px 'Courier New', monospace";
                ctx.fillText(`$ ${value}`, px + pw - 10, 69);

                drawFishScene(key, p, now);
                drawReelTrack(key, p, now);

                if (p.phase === "result" && p.result) {
                    drawFishResult(key, p);
                }

                drawFishPrompt(key, p, now);
            }

            function drawFishScene(key, p, now) {
                const sx = FISH_UI.sceneX[key];
                const sy = FISH_UI.sceneY;
                const sw = FISH_UI.sceneW;
                const sh = FISH_UI.sceneH;
                const waterY = sy + 126;

                ctx.save();
                roundRectPath(sx, sy, sw, sh, 10);
                ctx.clip();

                // Céu
                const sky = ctx.createLinearGradient(0, sy, 0, waterY);
                sky.addColorStop(0, "#4a8fbd");
                sky.addColorStop(0.55, "#9ad9d0");
                sky.addColorStop(1, "#f7d79a");
                ctx.fillStyle = sky;
                ctx.fillRect(sx, sy, sw, waterY - sy);

                // Sol
                ctx.fillStyle = "rgba(255,230,163,0.9)";
                ctx.shadowColor = "#ffe6a3";
                ctx.shadowBlur = 22;
                ctx.beginPath();
                ctx.arc(sx + sw - 94, sy + 30, 13, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Nuvens
                ctx.fillStyle = "rgba(255,255,255,0.35)";
                const cloudShift = Math.sin(now / 3200 + (key === "p2" ? 2 : 0)) * 8;
                for (const [cx, cy, cw] of [
                    [sx + 40, sy + 28, 42],
                    [sx + 104, sy + 44, 28],
                    [sx + 210, sy + 24, 34]
                ]) {
                    ctx.beginPath();
                    ctx.ellipse(cx + cloudShift, cy, cw, 7, 0, 0, Math.PI * 2);
                    ctx.ellipse(cx + cloudShift + cw * 0.35, cy - 5, cw * 0.55, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Montanhas
                ctx.fillStyle = "#5e947c";
                ctx.beginPath();
                ctx.moveTo(sx, waterY);
                ctx.lineTo(sx + 26, waterY - 42);
                ctx.lineTo(sx + 58, waterY - 20);
                ctx.lineTo(sx + 92, waterY - 54);
                ctx.lineTo(sx + 132, waterY - 22);
                ctx.lineTo(sx + 168, waterY - 44);
                ctx.lineTo(sx + 208, waterY - 16);
                ctx.lineTo(sx + 250, waterY - 38);
                ctx.lineTo(sx + 292, waterY - 12);
                ctx.lineTo(sx + sw, waterY);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#456f5f";
                ctx.beginPath();
                ctx.moveTo(sx, waterY);
                ctx.lineTo(sx + 42, waterY - 24);
                ctx.lineTo(sx + 86, waterY - 8);
                ctx.lineTo(sx + 138, waterY - 30);
                ctx.lineTo(sx + 190, waterY - 10);
                ctx.lineTo(sx + 244, waterY - 26);
                ctx.lineTo(sx + sw, waterY - 4);
                ctx.lineTo(sx + sw, waterY);
                ctx.closePath();
                ctx.fill();

                // Árvores
                for (const [tx, th] of [
                    [sx + 20, 34],
                    [sx + 42, 26],
                    [sx + 64, 30],
                    [sx + 96, 22]
                ]) {
                    ctx.fillStyle = "#5d3f2b";
                    ctx.fillRect(tx - 1, waterY - 8, 3, 8);
                    ctx.fillStyle = "#3a7d5c";
                    ctx.beginPath();
                    ctx.moveTo(tx - 10, waterY - 6);
                    ctx.lineTo(tx, waterY - 6 - th);
                    ctx.lineTo(tx + 10, waterY - 6);
                    ctx.closePath();
                    ctx.fill();
                }

                // Água
                const water = ctx.createLinearGradient(0, waterY, 0, sy + sh);
                water.addColorStop(0, "#347fa0");
                water.addColorStop(1, "#15506b");
                ctx.fillStyle = water;
                ctx.fillRect(sx, waterY, sw, sy + sh - waterY);

                // Ondulações
                ctx.lineWidth = 1;
                for (let i = 0; i < 7; i++) {
                    const wy = waterY + 12 + i * 11;
                    const phase = now / 900 + i * 0.8 + (key === "p2" ? 1.2 : 0);
                    ctx.strokeStyle = `rgba(200,255,255,${0.16 - i * 0.012})`;
                    ctx.beginPath();
                    for (let x = 0; x <= sw; x += 12) {
                        const yy = wy + Math.sin(phase + x * 0.06) * 1.5;
                        if (x === 0) ctx.moveTo(sx + x, yy);
                        else ctx.lineTo(sx + x, yy);
                    }
                    ctx.stroke();
                }

                // Doca de madeira
                ctx.fillStyle = "#8a5a3b";
                ctx.fillRect(sx + 8, sy + sh - 26, 74, 18);
                ctx.fillStyle = "#6d442b";
                for (let x = sx + 12; x < sx + 80; x += 14) {
                    ctx.fillRect(x, sy + sh - 26, 2, 18);
                }
                ctx.fillStyle = "#a9744b";
                ctx.fillRect(sx + 8, sy + sh - 28, 74, 3);
                ctx.fillStyle = "#5d3f2b";
                ctx.fillRect(sx + 18, sy + sh - 8, 4, 8);
                ctx.fillRect(sx + 64, sy + sh - 8, 4, 8);

                // Vara e boia
                const rodX = sx + sw - 34;
                const rodY = sy + 14;
                const bobberX = sx + 66 + p.castPower * 132;
                const bobberY = waterY + 24 + Math.sin(now / 300 + (key === "p2" ? 1 : 0)) * 2;

                if (p.phase !== "ready") {
                    ctx.strokeStyle = "#8a5a3b";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(rodX, rodY);
                    ctx.lineTo(rodX - 26, sy + 22);
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(235,255,251,0.45)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(rodX - 26, sy + 22);
                    ctx.quadraticCurveTo(
                        rodX - 34,
                        waterY - 18,
                        bobberX,
                        p.phase === "bite" ? bobberY + 6 : bobberY
                    );
                    ctx.stroke();

                    drawBobber(
                        bobberX,
                        p.phase === "bite" ? bobberY + 6 : bobberY,
                        now,
                        p.phase === "bite"
                    );
                } else {
                    ctx.strokeStyle = "#8a5a3b";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(rodX, rodY);
                    ctx.lineTo(rodX - 26, sy + 22);
                    ctx.stroke();
                }

                // Barra de força do lançamento
                if (p.phase === "cast") {
                    const bw = sw - 44;
                    const bx = sx + 22;
                    const by = sy + 13;

                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fillRect(bx - 2, by - 2, bw + 4, 11);

                    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
                    grad.addColorStop(0, "#39ff88");
                    grad.addColorStop(0.65, "#ffe14d");
                    grad.addColorStop(1, "#ff4d5a");
                    ctx.fillStyle = grad;
                    ctx.fillRect(bx, by, bw * p.castPower, 7);

                    ctx.strokeStyle = "rgba(234,255,251,0.45)";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(bx, by, bw, 7);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 8px 'Courier New', monospace";
                    ctx.textAlign = "left";
                    ctx.textBaseline = "bottom";
                    ctx.fillText("FORÇA", bx, by - 4);
                }

                // Escurece um pouco durante o recolhimento
                if (p.phase === "reel" || p.phase === "result") {
                    ctx.fillStyle = "rgba(0,8,10,0.18)";
                    ctx.fillRect(sx, sy, sw, sh);
                }

                ctx.restore();

                ctx.strokeStyle = "rgba(120,255,220,0.18)";
                ctx.lineWidth = 1;
                roundRectPath(sx, sy, sw, sh, 10);
                ctx.stroke();
            }

            function drawBobber(x, y, now, biting) {
                ctx.fillStyle = "rgba(200,255,255,0.18)";
                ctx.beginPath();
                ctx.ellipse(x, y + 6, 12, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.shadowColor = biting ? "#ffe14d" : "#ff4d5a";
                ctx.shadowBlur = biting ? 14 : 8;

                ctx.fillStyle = "#ff4d5a";
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#f4ffff";
                ctx.beginPath();
                ctx.arc(x, y + 1.5, 2.5, 0, Math.PI);
                ctx.fill();

                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                if (biting) {
                    const bob = Math.sin(now / 90) * 3;
                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 18px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#ffe14d";
                    ctx.shadowBlur = 14;
                    ctx.fillText("!", x, y - 24 + bob);
                    ctx.shadowBlur = 0;
                }
            }

            function drawReelTrack(key, p, now) {
                const tx = FISH_UI.trackX[key];
                const ty = FISH_UI.trackY;
                const tw = FISH_UI.trackW;
                const th = FISH_UI.trackH;
                const px = FISH_UI.progX[key];
                const pw = FISH_UI.progW;
                const active = p.phase === "reel" || p.phase === "result";
                const f = p.fish || FISH_TYPES[0];

                // Fundo do painel do recolhimento
                roundRectPath(tx - 5, ty - 16, tw + 10 + pw + 6, th + 22, 8);
                ctx.fillStyle = "rgba(0,8,10,0.72)";
                ctx.fill();
                ctx.strokeStyle = "rgba(120,255,220,0.16)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // Trilho
                ctx.fillStyle = "rgba(0,0,0,0.55)";
                ctx.fillRect(tx, ty, tw, th);
                ctx.strokeStyle = "rgba(120,255,220,0.18)";
                ctx.strokeRect(tx, ty, tw, th);

                const label = p.phase === "ready"
                    ? "PRONTO"
                    : p.phase === "cast"
                        ? "FORÇA"
                        : p.phase === "wait"
                            ? "AGUARDE"
                            : p.phase === "bite"
                                ? "FISGUE!"
                                : p.phase === "reel"
                                    ? "RECOLHA"
                                    : "RESULTADO";

                ctx.fillStyle = p.phase === "bite" ? "#ffe14d" : "rgba(186,255,242,0.55)";
                ctx.font = "bold 7px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText(label, tx + tw / 2, ty - 4);

                // Barra verde
                if (active) {
                    const barH = p.barSize * th;
                    const centerY = ty + (1 - p.reelY) * th;
                    const barTop = clamp(centerY - barH / 2, ty, ty + th - barH);

                    ctx.save();
                    ctx.shadowColor = "#39ff88";
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = "rgba(57,255,136,0.55)";
                    roundRectPath(tx + 2, barTop, tw - 4, barH, 5);
                    ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = "rgba(255,255,255,0.22)";
                    ctx.fillRect(tx + 5, barTop + 3, 3, Math.max(0, barH - 6));

                    // Peixe
                    const fishY = ty + (1 - p.fishY) * th;
                    drawPixelFish(tx + tw / 2, fishY, f.color, f.accent, 1.15);
                } else {
                    ctx.strokeStyle = "rgba(120,255,220,0.16)";
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.moveTo(tx + tw / 2, ty + 8);
                    ctx.lineTo(tx + tw / 2, ty + th - 8);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = "rgba(186,255,242,0.25)";
                    ctx.font = "8px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("—", tx + tw / 2, ty + th / 2);
                }

                // Barra de progresso
                ctx.fillStyle = "rgba(0,0,0,0.55)";
                ctx.fillRect(px, ty, pw, th);
                ctx.strokeStyle = "rgba(120,255,220,0.18)";
                ctx.strokeRect(px, ty, pw, th);

                const prog = clamp(p.progress, 0, 1);
                const fillH = prog * (th - 4);
                const color = prog > 0.6
                    ? "#39ff88"
                    : prog > 0.3
                        ? "#ffe14d"
                        : "#ff4d5a";

                if (active) {
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(px + 2, ty + th - 2 - fillH, pw - 4, fillH);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = "rgba(120,255,220,0.06)";
                    ctx.fillRect(px + 2, ty + th - 8, pw - 4, 6);
                }
            }

            function drawFishResult(key, p) {
                const sx = FISH_UI.sceneX[key];
                const sy = FISH_UI.sceneY;
                const sw = FISH_UI.sceneW;
                const cardW = sw - 82;
                const cardH = 128;
                const cardX = sx + 18;
                const cardY = sy + 42;
                const caught = p.result.caught;
                const f = p.result.fish || p.fish;

                roundRectPath(cardX, cardY, cardW, cardH, 9);
                ctx.fillStyle = "rgba(2,10,12,0.90)";
                ctx.fill();
                ctx.strokeStyle = caught ? "rgba(57,255,136,0.55)" : "rgba(255,77,90,0.55)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.textBaseline = "middle";

                if (caught && f) {
                    drawPixelFish(cardX + 38, cardY + 58, f.color, f.accent, 2.4);

                    ctx.textAlign = "left";
                    ctx.fillStyle = "#39ff88";
                    ctx.font = "bold 11px 'Courier New', monospace";
                    ctx.fillText("PEGOU!", cardX + 72, cardY + 28);

                    ctx.fillStyle = f.color;
                    ctx.font = "bold 13px 'Courier New', monospace";
                    ctx.fillText(f.name.toUpperCase(), cardX + 72, cardY + 50);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "10px 'Courier New', monospace";
                    ctx.fillText(`${p.result.size} cm`, cardX + 72, cardY + 70);

                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 12px 'Courier New', monospace";
                    ctx.fillText(`$ ${p.result.value}`, cardX + 72, cardY + 90);

                    ctx.fillStyle = "rgba(186,255,242,0.45)";
                    ctx.font = "7px 'Courier New', monospace";
                    ctx.fillText("MAIS UMA TENTATIVA...", cardX + 72, cardY + 110);
                } else {
                    ctx.textAlign = "left";
                    ctx.fillStyle = "#ff4d5a";
                    ctx.font = "bold 12px 'Courier New', monospace";
                    ctx.fillText("ESCAPOU!", cardX + 18, cardY + 32);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "10px 'Courier New', monospace";
                    ctx.fillText(
                        p.result.message || "O PEIXE FUGIU",
                        cardX + 18,
                        cardY + 56
                    );

                    ctx.fillStyle = "rgba(186,255,242,0.45)";
                    ctx.font = "8px 'Courier New', monospace";
                    ctx.fillText("TENTE NOVAMENTE", cardX + 18, cardY + 80);
                }
            }

            function drawFishPrompt(key, p, now) {
                const px = FISH_UI.panelX[key] + FISH_UI.panelW / 2;
                const py = 322;
                const blink = Math.sin(now / 110) > 0;

                let text = "";
                let color = "rgba(186,255,242,0.62)";

                if (p.phase === "ready") {
                    text = "LMB / ESPAÇO PARA LANÇAR";
                } else if (p.phase === "cast") {
                    text = "SOLTE PARA LANÇAR";
                    color = "#ffe14d";
                } else if (p.phase === "wait") {
                    text = "AGUARDE O PEIXE...";
                } else if (p.phase === "bite") {
                    text = blink ? "FISGUE! [LMB]" : "FISGUE!";
                    color = "#ffe14d";
                } else if (p.phase === "reel") {
                    text = "SEGURE / SOLTE PARA RECOLHER";
                    color = "#39ff88";
                } else if (p.phase === "result") {
                    text = p.result && p.result.caught
                        ? "PEIXE FISGADO!"
                        : "QUE PENA...";
                    color = p.result && p.result.caught ? "#39ff88" : "#ff4d5a";
                }

                ctx.fillStyle = color;
                ctx.font = "bold 10px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(text, px, py);

                if (p.phase === "reel") {
                    ctx.fillStyle = "rgba(186,255,242,0.38)";
                    ctx.font = "8px 'Courier New', monospace";
                    ctx.fillText(
                        "MANTENHA O PEIXE NA ÁREA VERDE",
                        px,
                        py + 18
                    );
                }

                if (p.phase === "reel" || p.phase === "result") {
                    const pct = Math.round(clamp(p.progress, 0, 1) * 100);
                    ctx.fillStyle = "rgba(186,255,242,0.34)";
                    ctx.font = "8px 'Courier New', monospace";
                    ctx.fillText(pct + "%", px, py + 34);
                }

                // Progresso de peixes fisgados
                ctx.fillStyle = "rgba(186,255,242,0.32)";
                ctx.font = "7px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText(
                    "PEIXES FISGADOS",
                    px,
                    FISH_UI.panelY + FISH_UI.panelH - 58
                );

                const score = key === "p1" ? fish.score1 : fish.score2;
                const accent = key === "p1" ? "#39ff88" : "#ff4d5a";
                const dotY = FISH_UI.panelY + FISH_UI.panelH - 36;
                const startX = px - 28;

                for (let i = 0; i < FISH.WIN_COUNT; i++) {
                    const filled = i < score;
                    drawPixelFish(
                        startX + i * 28,
                        dotY,
                        filled ? accent : "rgba(186,255,242,0.15)",
                        filled ? "#04110d" : "rgba(186,255,242,0.15)",
                        1.25
                    );
                }
            }

            function drawFishOverlays(now) {
                if (fish.screenFlash > 0) {
                    ctx.fillStyle = `rgba(255,255,255,${fish.screenFlash * 0.07})`;
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);
                }

                if (!connected) {
                    ctx.fillStyle = "rgba(0,8,8,0.68)";
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 26px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#7dffe0";
                    ctx.shadowBlur = 18;
                    ctx.fillText("WAITING FOR PLAYER", CANVAS_W / 2, CANVAS_H / 2 - 10);
                    ctx.shadowBlur = 0;

                    const blink = Math.sin(now / 300) > 0 ? "_" : " ";
                    ctx.fillStyle = "rgba(186,255,242,0.7)";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "AGUARDANDO CONEXÃO " + blink,
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 30
                    );
                    return;
                }

                if (fish.gameOver) {
                    ctx.fillStyle = "rgba(0,8,8,0.82)";
                    ctx.fillRect(CRT.X, CRT.Y, CRT.W, CRT.H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 38px 'Courier New', monospace";
                    ctx.shadowColor = "#ffe14d";
                    ctx.shadowBlur = 22;
                    ctx.fillText("VITÓRIA", CANVAS_W / 2, CANVAS_H / 2 - 44);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 22px 'Courier New', monospace";
                    ctx.fillText(fish.winner.toUpperCase(), CANVAS_W / 2, CANVAS_H / 2);

                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "13px 'Courier New', monospace";
                    ctx.fillText(
                        isHost
                            ? "ENTER PARA JOGAR NOVAMENTE"
                            : "AGUARDANDO O HOST REINICIAR",
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 44
                    );

                    ctx.fillStyle = "rgba(186,255,242,0.38)";
                    ctx.font = "10px 'Courier New', monospace";
                    ctx.fillText(
                        `PEIXES: ${fish.score1} - ${fish.score2}  ·  $ ${fish.value1} - $ ${fish.value2}`,
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 72
                    );
                }
            }

            function drawPixelFish(x, y, color, accent, scale = 1) {
                const s = Math.max(1, scale);

                ctx.save();
                ctx.fillStyle = color;

                // Corpo
                ctx.fillRect(x - 6 * s, y - 2 * s, 8 * s, 4 * s);
                ctx.fillRect(x - 8 * s, y - 1 * s, 2 * s, 2 * s);

                // Cauda
                ctx.fillRect(x + 2 * s, y - 4 * s, 2 * s, 8 * s);
                ctx.fillRect(x + 4 * s, y - 3 * s, 2 * s, 6 * s);

                // Barbatana
                ctx.fillRect(x - 2 * s, y - 4 * s, 3 * s, 2 * s);

                // Olho
                ctx.fillStyle = accent;
                ctx.fillRect(x - 3 * s, y - 1 * s, 1.5 * s, 1.5 * s);
                ctx.fillStyle = "#04110d";
                ctx.fillRect(x - 3 * s, y - 1 * s, 0.7 * s, 0.7 * s);

                ctx.restore();
            }

            // ── Quadra em perspectiva ──
            function drawTTCourt(now) {
                const left = TT.LEFT;
                const right = TT.RIGHT;
                const tableY = TT.TABLE_Y;
                const netX = TT.NET_X;
                const netTop = TT.NET_TOP;
                const tooHigh = TT.TOO_HIGH_Y;

                const localSide = isHost ? "p1" : "p2";
                const ballSide = tt.ballX < netX ? "p1" : "p2";
                const hittable = tt.phase === "rally" &&
                    ballSide === localSide &&
                    tt.ballY >= tooHigh &&
                    !(tt.lastHitter === localSide && !tt.crossedNet);

                const leftZone = [
                    [left, 194],
                    [netX - 14, 238],
                    [netX - 14, tableY],
                    [left, tableY]
                ];
                const rightZone = [
                    [netX + 14, 238],
                    [right, 194],
                    [right, tableY],
                    [netX + 14, tableY]
                ];

                const serveP1 = tt.phase === "serve" && tt.server === "p1";
                const serveP2 = tt.phase === "serve" && tt.server === "p2";

                const p1Glow = (localSide === "p1" && hittable) || serveP1 ? 0.10 : 0.055;
                const p2Glow = (localSide === "p2" && hittable) || serveP2 ? 0.10 : 0.055;

                fillZone(leftZone, `rgba(57,255,136,${p1Glow})`);
                fillZone(rightZone, `rgba(255,77,90,${p2Glow})`);

                const p1Active = (ballSide === "p1" && tt.phase === "rally") || serveP1;
                const p2Active = (ballSide === "p2" && tt.phase === "rally") || serveP2;

                const p1Pulse = 0.50 + (p1Active ? 0.12 * Math.sin(now / 160) : 0);
                const p2Pulse = 0.50 + (p2Active ? 0.12 * Math.sin(now / 160) : 0);

                strokeZone(leftZone, "#39ff88", p1Active ? 0.95 : p1Pulse, p1Active ? 3 : 2, p1Active ? 16 : 8);
                strokeZone(rightZone, "#ff4d5a", p2Active ? 0.95 : p2Pulse, p2Active ? 3 : 2, p2Active ? 16 : 8);

                // Linha da mesa
                ctx.save();
                ctx.strokeStyle = "rgba(186,255,242,0.78)";
                ctx.shadowColor = "#7dffe0";
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(left, tableY);
                ctx.lineTo(right, tableY);
                ctx.stroke();
                ctx.restore();

                // Linhas frontais decorativas
                ctx.strokeStyle = "rgba(186,255,242,0.12)";
                ctx.lineWidth = 1;
                for (const y of [tableY + 16, tableY + 32]) {
                    ctx.beginPath();
                    ctx.moveTo(left, y);
                    ctx.lineTo(right, y);
                    ctx.stroke();
                }
                for (let x = left; x <= right; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, tableY + 16);
                    ctx.lineTo(x, tableY + 21);
                    ctx.stroke();
                }

                // Linha pontilhada "muito alto"
                ctx.save();
                ctx.setLineDash([6, 8]);
                ctx.strokeStyle = "rgba(186,255,242,0.30)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(left, tooHigh);
                ctx.lineTo(right, tooHigh);
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = "rgba(186,255,242,0.32)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "right";
                ctx.textBaseline = "bottom";
                ctx.fillText("TOO HIGH", right, tooHigh - 4);

                // Rede
                ctx.save();
                ctx.strokeStyle = tt.netFlash > 0
                    ? "#ff4d5a"
                    : "rgba(234,255,251,0.9)";
                ctx.shadowColor = tt.netFlash > 0 ? "#ff4d5a" : "#bafff2";
                ctx.shadowBlur = tt.netFlash > 0 ? 26 : 12;
                ctx.lineWidth = tt.netFlash > 0 ? 4 : 2.5;
                ctx.beginPath();
                ctx.moveTo(netX, netTop);
                ctx.lineTo(netX, tableY + 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(netX - 9, netTop);
                ctx.lineTo(netX + 9, netTop);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(netX - 11, tableY + 2);
                ctx.lineTo(netX + 11, tableY + 2);
                ctx.stroke();
                ctx.restore();

                // Malha da rede
                ctx.fillStyle = "rgba(186,255,242,0.16)";
                for (let y = netTop + 6; y < tableY; y += 6) {
                    for (let x = netX - 6; x <= netX + 6; x += 4) {
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            function fillZone(points, color) {
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            function strokeZone(points, color, alpha, width, blur) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                ctx.closePath();
                ctx.strokeStyle = color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = width;
                ctx.shadowColor = color;
                ctx.shadowBlur = blur;
                ctx.stroke();
                ctx.restore();
            }

            // ── Bola ──
            function drawTTBall(now) {
                if (tt.phase === "gameover") return;

                if (tt.phase === "serve" && !tt.serveTossed) {
                    const bob = Math.sin(now / 260) * 2;
                    drawTTBallShadow();
                    drawBallAt(tt.ballX, tt.ballY + bob, 0.38);
                    ctx.fillStyle = "rgba(186,255,242,0.42)";
                    ctx.font = "9px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText("SAQUE", tt.ballX, tt.ballY - 18);
                    return;
                }

                drawTTBallShadow();

                for (let i = 0; i < tt.ballTrail.length; i++) {
                    const p = tt.ballTrail[i];
                    const a = ((i + 1) / tt.ballTrail.length) * 0.20;
                    ctx.fillStyle = `rgba(186,255,242,${a})`;
                    ctx.beginPath();
                    ctx.arc(
                        p.x,
                        p.y,
                        TT.BALL_R * (0.3 + (i / tt.ballTrail.length) * 0.7),
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }

                const tooHigh = tt.ballY < TT.TOO_HIGH_Y;
                drawBallAt(tt.ballX, tt.ballY, tooHigh ? 0.45 : 1);

                if (tooHigh) {
                    ctx.fillStyle = "rgba(255,225,77,0.8)";
                    ctx.font = "10px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        "TOO HIGH",
                        tt.ballX,
                        Math.max(32, tt.ballY - 14)
                    );
                }
            }

            function drawBallAt(x, y, alpha) {
                const r = TT.BALL_R;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowColor = "#d8fff6";
                ctx.shadowBlur = 20;
                ctx.fillStyle = "#eafffb";
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                ctx.beginPath();
                ctx.arc(x - 1.5, y - 1.5, r * 0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawTTBallShadow() {
                const t = clamp(
                    (tt.ballY - TT.TOO_HIGH_Y) / (TT.TABLE_Y - TT.TOO_HIGH_Y),
                    0,
                    1
                );

                ctx.fillStyle = `rgba(0,0,0,${0.08 + t * 0.20})`;
                ctx.beginPath();
                ctx.ellipse(
                    tt.ballX,
                    TT.TABLE_Y - 3,
                    12,
                    4,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            // ── HUD ──
            function drawTTHud(now) {
                const left = TT.LEFT;
                const right = TT.RIGHT;

                // Painel de nomes/placar
                ctx.fillStyle = "rgba(0,0,0,0.45)";
                ctx.fillRect(70, 52, 200, 54);
                ctx.strokeStyle = "rgba(186,255,242,0.18)";
                ctx.lineWidth = 1;
                ctx.strokeRect(70, 52, 200, 54);

                const p1Name = isHost ? myName : otherName;
                const p2Name = isHost ? otherName : myName;

                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.textBaseline = "middle";

                ctx.textAlign = "left";
                ctx.fillStyle = "#39ff88";
                ctx.fillText(p1Name.toUpperCase().slice(0, 14), 80, 70);
                ctx.textAlign = "right";
                ctx.fillStyle = "#eafffb";
                ctx.fillText(tt.score1, 258, 70);

                ctx.textAlign = "left";
                ctx.fillStyle = "#ff4d5a";
                ctx.fillText(p2Name.toUpperCase().slice(0, 14), 80, 94);
                ctx.textAlign = "right";
                ctx.fillStyle = "#eafffb";
                ctx.fillText(tt.score2, 258, 94);

                // Placar grande
                const pad = n => String(n).padStart(2, "0");
                ctx.save();
                ctx.font = "bold 38px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#eafffb";
                ctx.shadowColor = "#7dffe0";
                ctx.shadowBlur = 18;
                ctx.fillText(`${pad(tt.score1)} - ${pad(tt.score2)}`, CANVAS_W / 2, 80);
                ctx.restore();

                if (tt.phase === "serve" && connected) {
                    const serverName = tt.server === "p1" ? p1Name : p2Name;
                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "11px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "top";
                    ctx.fillText(
                        "SAQUE: " + serverName.toUpperCase(),
                        CANVAS_W / 2,
                        106
                    );
                }

                // Stamina local
                const stW = 170;
                const stH = 7;
                const stX = left;
                const stY = 438;
                ctx.fillStyle = "rgba(186,255,242,0.12)";
                ctx.fillRect(stX, stY, stW, stH);

                const stPct = tt.stamina / TT.STAMINA_MAX;
                const stColor = stPct > 0.5
                    ? "#39ff88"
                    : stPct > 0.25
                        ? "#ffe14d"
                        : "#ff4d5a";

                ctx.fillStyle = stColor;
                ctx.shadowColor = stColor;
                ctx.shadowBlur = 8;
                ctx.fillRect(stX, stY, stW * stPct, stH);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "rgba(186,255,242,0.55)";
                ctx.font = "9px 'Courier New', monospace";
                ctx.textAlign = "left";
                ctx.textBaseline = "bottom";
                ctx.fillText("STAMINA", stX, stY - 4);

                // Carga local
                if (tt.charging) {
                    const cw = 230;
                    const ch = 9;
                    const cx = (CANVAS_W - cw) / 2;
                    const cy = 438;

                    ctx.fillStyle = "rgba(186,255,242,0.12)";
                    ctx.fillRect(cx, cy, cw, ch);

                    const grad = ctx.createLinearGradient(cx, 0, cx + cw, 0);
                    grad.addColorStop(0, "#39ff88");
                    grad.addColorStop(0.65, "#ffe14d");
                    grad.addColorStop(1, "#ff4d5a");
                    ctx.fillStyle = grad;
                    ctx.fillRect(cx, cy, cw * tt.charge, ch);

                    ctx.strokeStyle = "rgba(234,255,251,0.45)";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(cx, cy, cw, ch);

                    const label = tt.chargeShot === "forehand" ? "FOREHAND" : "LOB";
                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 11px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        label + "  " + Math.round(tt.charge * 100) + "%",
                        CANVAS_W / 2,
                        cy - 5
                    );

                    const ballSide = tt.ballX < TT.NET_X ? "p1" : "p2";
                    const localSide = isHost ? "p1" : "p2";
                    const spikeReady =
                        tt.chargeShot === "forehand" &&
                        tt.charge > 0.5 &&
                        tt.ballVY < 1.4 &&
                        ballSide === localSide &&
                        tt.ballY >= TT.TOO_HIGH_Y;

                    if (spikeReady) {
                        ctx.fillStyle = "#ffe14d";
                        ctx.font = "bold 10px 'Courier New', monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText("SPIKE!", CANVAS_W / 2, 416);
                    }
                }

                // Carga do oponente
                if (tt.oppCharging && (tt.phase === "rally" || tt.phase === "serve")) {
                    const ow = 110;
                    const oh = 5;
                    const ox = isHost ? right - ow : left;
                    const oy = 416;
                    const shotName = tt.oppShot === "forehand" ? "FOREHAND" : "LOB";

                    ctx.fillStyle = "rgba(186,255,242,0.10)";
                    ctx.fillRect(ox, oy, ow, oh);
                    ctx.fillStyle = isHost ? "#ff4d5a" : "#39ff88";
                    ctx.fillRect(ox, oy, ow * tt.oppCharge, oh);

                    ctx.fillStyle = "rgba(186,255,242,0.45)";
                    ctx.font = "9px 'Courier New', monospace";
                    ctx.textAlign = isHost ? "right" : "left";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(
                        "OPONENTE " + shotName,
                        isHost ? right : left,
                        oy - 4
                    );
                }

                // Instruções
                ctx.fillStyle = "rgba(234,255,251,0.75)";
                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(
                    "FOREHAND [LMB]   /   [RMB] LOB",
                    CANVAS_W / 2,
                    458
                );
                ctx.fillStyle = "rgba(186,255,242,0.45)";
                ctx.font = "10px 'Courier New', monospace";
                ctx.fillText("HOLD TO CHARGE", CANVAS_W / 2, 473);

                // Feedback
                if (tt.feedback) {
                    ctx.fillStyle = "rgba(255,225,77,0.85)";
                    ctx.font = "bold 13px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(tt.feedback, CANVAS_W / 2, 402);
                }
            }

            // ── Overlays ──
            function drawTTOverlays(now) {
                if (tt.screenFlash > 0) {
                    ctx.fillStyle = `rgba(186,255,242,${tt.screenFlash * 0.10})`;
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                }

                if (!connected) {
                    ctx.fillStyle = "rgba(0,8,8,0.62)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 26px 'Courier New', monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#7dffe0";
                    ctx.shadowBlur = 18;
                    ctx.fillText("WAITING FOR PLAYER", CANVAS_W / 2, CANVAS_H / 2 - 10);
                    ctx.shadowBlur = 0;

                    const blink = Math.sin(now / 300) > 0 ? "_" : " ";
                    ctx.fillStyle = "rgba(186,255,242,0.7)";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "AGUARDANDO CONEXÃO " + blink,
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 30
                    );
                    return;
                }

                if (tt.phase === "point") {
                    ctx.fillStyle = "rgba(0,8,8,0.35)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = tt.pointMessageColor;
                    ctx.font = "bold 34px 'Courier New', monospace";
                    ctx.shadowColor = tt.pointMessageColor;
                    ctx.shadowBlur = 20;
                    ctx.fillText(tt.pointMessage, CANVAS_W / 2, CANVAS_H / 2 - 20);
                    ctx.shadowBlur = 0;

                    const winnerName = tt.lastPoint === "p1"
                        ? (isHost ? myName : otherName)
                        : (isHost ? otherName : myName);

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "14px 'Courier New', monospace";
                    ctx.fillText(
                        "PONTO DE " + winnerName.toUpperCase(),
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 22
                    );
                }

                if (tt.phase === "gameover") {
                    ctx.fillStyle = "rgba(0,8,8,0.78)";
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.fillStyle = "#ffe14d";
                    ctx.font = "bold 38px 'Courier New', monospace";
                    ctx.shadowColor = "#ffe14d";
                    ctx.shadowBlur = 22;
                    ctx.fillText("VITÓRIA", CANVAS_W / 2, CANVAS_H / 2 - 40);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "#eafffb";
                    ctx.font = "bold 22px 'Courier New', monospace";
                    ctx.fillText(tt.winner.toUpperCase(), CANVAS_W / 2, CANVAS_H / 2 + 4);

                    ctx.fillStyle = "rgba(186,255,242,0.6)";
                    ctx.font = "13px 'Courier New', monospace";
                    ctx.fillText(
                        isHost
                            ? "ENTER PARA JOGAR NOVAMENTE"
                            : "AGUARDANDO O HOST REINICIAR",
                        CANVAS_W / 2,
                        CANVAS_H / 2 + 44
                    );
                }
            }

            // ══════════════════════════════════════
            //  Reiniciar partida de Tênis de Mesa (host)
            // ══════════════════════════════════════

            window.addEventListener("keydown", e => {
                if (
                    e.key === "Enter" &&
                    currentMinigame === "tableTennis" &&
                    isHost &&
                    tt.gameOver &&
                    connected
                ) {
                    resetTTMatch(false);
                    broadcastTTState();
                }
            });

            // Reiniciar partida de Pesca (host)
            window.addEventListener("keydown", e => {
                if (
                    e.key === "Enter" &&
                    currentMinigame === "fishing" &&
                    isHost &&
                    fish.gameOver &&
                    connected
                ) {
                    resetFishMatch(false);
                    broadcastFishState();
                }
            });

            // ══════════════════════════════════════
            //  Desenhar raquete do Pong
            // ══════════════════════════════════════

            function drawPaddle(x, y, color) {
                const baseY = y;
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = color;

                const r = 4;
                ctx.beginPath();
                ctx.moveTo(x + r, baseY);
                ctx.lineTo(x + PADDLE_W - r, baseY);
                ctx.quadraticCurveTo(x + PADDLE_W, baseY, x + PADDLE_W, baseY + r);
                ctx.lineTo(x + PADDLE_W, baseY + PADDLE_H - r);
                ctx.quadraticCurveTo(x + PADDLE_W, baseY + PADDLE_H, x + PADDLE_W - r, baseY + PADDLE_H);
                ctx.lineTo(x + r, baseY + PADDLE_H);
                ctx.quadraticCurveTo(x, baseY + PADDLE_H, x, baseY + PADDLE_H - r);
                ctx.lineTo(x, baseY + r);
                ctx.quadraticCurveTo(x, baseY, x + r, baseY);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // ══════════════════════════════════════
            //  Utilitário
            // ══════════════════════════════════════

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function roundRectPath(x, y, w, h, r) {
                const rr = Math.min(r, w / 2, h / 2);

                ctx.beginPath();
                ctx.moveTo(x + rr, y);
                ctx.arcTo(x + w, y, x + w, y + h, rr);
                ctx.arcTo(x + w, y + h, x, y + h, rr);
                ctx.arcTo(x, y + h, x, y, rr);
                ctx.arcTo(x, y, x + w, y, rr);
                ctx.closePath();
            }

            // ══════════════════════════════════════
            //  Iniciar
            // ══════════════════════════════════════

            updateInfoText();
            updateScoreDisplay();
            updateNameDisplays();
            resetBall();
            resetTTMatch(true);
            resetFishMatch(true);
            canvas.classList.add("crt-mode");
            updateGameSelector();

            // Hook de depuração (não afeta o jogo normal)
            if (urlParams.get("debug") === "1") {
                window.__ping = {
                    fish,
                    state,
                    tt,
                    switchMinigame,
                    setFishHolding,
                    resetFishMatch,
                    finishFishAttempt,
                    PONG,
                    CANVAS_W,
                    CANVAS_H,
                    PADDLE_H
                };
            }

            // Links diretos: ?game=pong | ?game=tt | ?game=fish
            const gameFromUrl = urlParams.get("game");
            const gameAliases = {
                pong: "pong",
                tt: "tableTennis",
                tableTennis: "tableTennis",
                fish: "fishing",
                fishing: "fishing"
            };

            if (gameFromUrl && gameAliases[gameFromUrl]) {
                switchMinigame(gameAliases[gameFromUrl], false);
            }

            requestAnimationFrame(gameLoop);

        })();
    </script>

</body>
